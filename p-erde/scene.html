<script>
const TIMING = __TIMING__;
const S_ = TIMING.sentences, ph = i => TIMING.phrases[i][0], pe = i => TIMING.phrases[i][1];
const T = { b: S_[1][0], c: S_[2][0], d: S_[3][0], e: S_[4][0], f: S_[5][0], end: S_[5][1] + .2 };
const STOP = ph(1) + (pe(1) - ph(1)) * .82;   // Moment "aufhört"
window.CFG = {
  REPL: [['sechzehnhundertsiebzig', '1.670']],
  DUR: TIMING.dur, CUTS: [T.b, T.c, T.d, T.e, T.f], PHRASES: TIMING.phrases, CAP_END: T.end,
  KEY: /^(Erde|plötzlich|aufhört|drehen|Äquator|1\.670|Kilometern|Boden|weiter|Luft|Ozeane|Häuser|du|Stürme|Flugzeug|Tag|Jahr|Sonne|Nacht|Gedankenexperiment|bremst|Millisekunden|Jahrhundert)/,
  split: t => 28 * Math.max(0, 1 - Math.abs(t - STOP) / .25) + 8 * (1 - p(t, 0, .6)) + 12 * Math.max(0, 1 - Math.abs(t - ph(4) - .35) / .2),
  shake: t => (t > STOP && t < STOP + .4 ? 16 * (1 - (t - STOP) / .4) : 0) + (t > ph(4) + .35 && t < ph(4) + .85 ? 12 * (1 - (t - ph(4) - .35) / .5) : 0),
};

<script>

const LANDPTS = (() => { const pts = []; LAND.forEach(([r, c0, c1]) => { for (let c = c0; c <= c1; c++) for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) pts.push([(90 - r * 5 - 1.25 - a * 2.5) * Math.PI / 180, (-180 + c * 5 + 1.25 + b * 2.5) * Math.PI / 180]); }); return pts; })();
const OCEAN = (() => { const pts = []; for (let la = -80; la <= 80; la += 7.5) for (let lo = -180; lo < 180; lo += 7.5) pts.push([la * Math.PI / 180, lo * Math.PI / 180]); return pts; })();
function globe(x, y, R, rot, o = {}) {
  const tilt = o.tilt ?? .32, ct = Math.cos(tilt), st = Math.sin(tilt), sun = o.sun ?? null;

  g.save(); g.globalAlpha = o.a ?? 1;

  g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
  const proj = (la, lo) => { const l = lo + rot, cl = Math.cos(la); const X = cl * Math.sin(l), Y0 = Math.sin(la), Z0 = cl * Math.cos(l); return [X, -(ct * Y0 - st * Z0), st * Y0 + ct * Z0, l]; };
  OCEAN.forEach(([la, lo]) => { const [X, Y, Z] = proj(la, lo); if (Z <= 0) return; g.fillStyle = `rgba(110,170,255,${.18 * Z})`; g.fillRect(x + X * R - 1.5, y + Y * R - 1.5, 3, 3); });
  const ds = R / 105;

    const [X, Y, Z, l] = proj(la, lo); if (Z <= 0) return;
    let lit = 1; if (sun != null) lit = clamp(.25 + 1.6 * Math.cos(lo + rot - sun) * Math.cos(la));

    g.fillStyle = rgb(mix([20, 30, 70], c, lit), .5 + .5 * Z); const s = ds * (1.6 + Z * 1.6); g.fillRect(x + X * R - s / 2, y + Y * R - s / 2, s, s);
  });
  if (o.equator) { g.strokeStyle = `rgba(255,214,60,${o.equator})`; g.lineWidth = 5; g.shadowColor = '#ffd23f'; g.shadowBlur = 18; g.beginPath(); for (let i = 0; i <= 90; i++) { const lo = -Math.PI + i / 90 * 2 * Math.PI; const [X, Y, Z] = proj(0, lo); if (Z > 0) g.lineTo(x + X * R, y + Y * R); else g.moveTo(x + X * R, y + Y * R); } g.stroke(); g.shadowBlur = 0; }
  if (sun != null) { const lx = Math.sin(sun - 0), sh = g.createLinearGradient(x - R * Math.sign(lx || 1), y, x + R * Math.sign(lx || 1), y); }

  g.restore();

}

// ---------- Szenen ----------
function rotAt(t) {  // Drehwinkel: rasend schnell im Hook, abrupter Stopp, danach ruhig
  if (t < STOP) return t * 7 + t * t * 2;
  const s0 = STOP * 7 + STOP * STOP * 2; return s0;
}
function sceneA(t) {
  bg([[0, '#1a0a55'], [.55, '#0b2a7a'], [1, '#04102e']]); stars(t, .9, t < STOP ? t * 4 : STOP * 4); aurora(t, .7);

  if (!frozen) { g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 26; i++) { const a = i / 26 * 6.283 + t * 4; g.strokeStyle = `rgba(140,200,255,${.25})`; g.lineWidth = 5; g.beginPath(); g.arc(540, 860, 430 + (i % 4) * 26, a, a + .35); g.stroke(); } g.restore(); }
  const sc = 1 + (frozen ? .08 * (1 - eo(p(t, STOP, STOP + .35))) : 0);
  g.save(); g.translate(540, 860); g.scale(sc, sc); g.translate(-540, -860);
  globe(540, 860, 380, rotAt(t));
  g.restore();
  if (frozen) {
    const k = p(t, STOP, STOP + .3);
    g.fillStyle = `rgba(255,255,255,${(1 - k) * .55})`; g.fillRect(0, 0, W, H);
    text('STOPP.', 540, 1370, 230, 'IDB', '#ff4a5e', { sc: lerp(2.6, 1, eback(k)), alpha: clamp(k * 3), ls: -8, glow: 'rgba(255,60,90,.7)', blur: 50, stroke: 12, strokeColor: '#1a0a40' });
  }
  slam(['WAS', 'WÄRE,', 'WENN…'], 540, 290, 92, 'IDB', '#ffffff', { t, s: .5 }, .25, { ls: -3 });
  const out = eio(p(t, T.b - .35, T.b)); if (out > 0) { g.fillStyle = `rgba(4,8,30,${out})`; g.fillRect(0, 0, W, H); }
}

function gauge(x, y, r, v, max, k) {
  g.save(); g.globalAlpha = eo(k);
  const a0 = Math.PI * .8, a1 = Math.PI * 2.2, av = lerp(a0, a1, clamp(v / max));

  g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(av) * (r - 40), y + Math.sin(av) * (r - 40)); g.stroke();

function sceneB(t) {

  const proj = globe(540, 640, 340, rotAt(STOP) + u * .55, { equator: eo(p(u, .2, .8)) });
  // Person auf dem Äquator mit Bewegungsspur
  const lo0 = -rotAt(STOP) - u * .55 + .15, [X, Y, Z] = proj(0, lo0);

function label(s, x, y, col, k, size = 40) { if (k > 0) text(s, x, y, size, 'IDB', col, { alpha: eo(k), sc: lerp(1.4, 1, eback(k)), ls: 1 }); }

// Gegenstände, die nach dem Stopp weiterfliegen
function house(x, y, s, c) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = c; g.fillRect(-40, -40, 80, 70); g.beginPath(); g.moveTo(-52, -38); g.lineTo(0, -82); g.lineTo(52, -38); g.fill(); g.fillStyle = '#ffe9a0'; g.fillRect(-26, -22, 18, 18); g.fillRect(8, -22, 18, 18); g.fillStyle = '#5a2a1a'; g.fillRect(-10, 6, 20, 24); g.restore(); }

function cloud(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = 'rgba(255,255,255,.95)'; [[-40, 0, 40], [0, -20, 50], [45, 0, 38], [10, 14, 40]].forEach(([a, b, r]) => { g.beginPath(); g.arc(a, b, r, 0, 7); g.fill(); }); g.restore(); }
function person(x, y, s, c) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = c; g.beginPath(); g.arc(0, -70, 20, 0, 7); g.fill(); g.lineWidth = 16; g.lineCap = 'round'; g.strokeStyle = c; g.beginPath(); g.moveTo(0, -48); g.lineTo(0, 0); g.moveTo(0, -36); g.lineTo(-30, -60); g.moveTo(0, -36); g.lineTo(32, -56); g.moveTo(0, 0); g.lineTo(-22, 40); g.moveTo(0, 0); g.lineTo(24, 38); g.stroke(); g.restore(); }
function sceneC(t) {

    g.globalAlpha = 1; draw(0, 0, 1); g.restore();
    const kl = p(t, tw, tw + .3);
    if (kl > 0) text(lab, 540, 330 + i * 120, 104, 'IDB', ['#ffffff', '#3fd0ff', '#ff9a7a', '#ffd23f'][i], { alpha: clamp(kl * 3), sc: lerp(2, 1, eback(kl)), ls: -2, stroke: 10, strokeColor: '#2a0b45' });
  });
  if (u > stop - .02) { const k = p(u, stop, stop + .25); if (k < 1) { g.fillStyle = `rgba(255,255,255,${(1 - k) * .5})`; g.fillRect(0, 0, W, H); } }
  label('BODEN STOPPT', 540, 180, '#ffffff', p(t, ph(4), ph(4) + .3), 84);
}

function sceneD(t) {
  const u = t - T.d;
  bg([[0, '#06204e'], [.5, '#0b3a6e'], [1, '#160a40']]); stars(t, .5);
  globe(540, 700, 330, rotAt(STOP) + u * .2, { atm: [180, 230, 255] });

function sceneE(t) {

  const k = p(t, ph(13), ph(13) + .4);

    g.fillStyle = `rgba(4,6,24,${eo(ke)})`; g.fillRect(0, 0, W, H);
    g.save(); g.font = '150px IDB'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '-4px';
    const gr = g.createLinearGradient(140, 0, 940, 0); gr.addColorStop(0, '#3fd0ff'); gr.addColorStop(.5, '#7a5cff'); gr.addColorStop(1, '#ff5ac8');
    g.fillStyle = gr; g.globalAlpha = eo(ke); g.translate(540, 840); const s = lerp(1.25, 1, eback(ke)); g.scale(s, s);
    g.fillText('KEINE', 0, -80); g.fillText('PANIK.', 0, 80); g.restore();
    text('Die Erde dreht sich weiter.', 540, 1060, 50, 'IDS', '#ffffff', { alpha: eo(p(t, T.end + .3, T.end + .8)) });
    text('Sie bremst nur um ca. 2 ms pro Jahrhundert.', 540, 1140, 36, 'IDM', 'rgba(255,255,255,.7)', { alpha: eo(p(t, T.end + .6, T.end + 1.1)) });
  }
}

function scene(t) {
  if (t < T.b) sceneA(t); else if (t < T.c) sceneB(t); else if (t < T.d) sceneC(t); else if (t < T.e) sceneD(t); else if (t < T.f) sceneE(t); else sceneF(t);
}
