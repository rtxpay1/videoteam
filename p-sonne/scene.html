<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const TIMING = __TIMING__;
const S_ = TIMING.sentences, NS = S_.length;
const at = (i, f) => S_[i][0] + (S_[i][1] - S_[i][0]) * f;
const END = S_[NS - 1][1] + .2;
const BLACK = at(3, .78);   // Moment "Dann: Schwarz."
window.CFG = {
  REPL: [['acht Minuten', '8 Minuten'], ['hunderttausend', '100.000'], ['minus achtzehn', '−18'], ['minus siebzig', '−70'], ['fünf Milliarden', '5 Milliarden']],
  DUR: TIMING.dur, CUTS: S_.slice(1).map(s => s[0]), PHRASES: TIMING.phrases, CAP_END: END,
  KEY: /^(Sonne|ausgeht|merken|8|Minuten|Schwarz|Mond|Schock|Bahn|All|100\.000|kalt|−18|−70|Grad|frieren|Twist|Leben|Quellen|5|Milliarden|Brennstoff)/,
  split: t => 22 * (1 - p(t, 0, .6)) + 34 * Math.max(0, 1 - Math.abs(t - BLACK) / .3) + 24 * Math.max(0, 1 - Math.abs(t - S_[5][0]) / .3) + 20 * Math.max(0, 1 - Math.abs(t - S_[12][0]) / .3),
  shake: t => (t > BLACK && t < BLACK + .5 ? 18 * (1 - (t - BLACK) / .5) : 0) + (t > S_[5][0] && t < S_[5][0] + .5 ? 14 * (1 - (t - S_[5][0]) / .5) : 0) + (t > S_[8][0] && t < S_[11][0] ? 1.5 + Math.sin(t * 40) : 0),
};
</script>
<script src="../engine/lib.js"></script>
<script>
const punch = (t, t0, amt = .12, d = .35) => 1 + amt * Math.max(0, 1 - Math.abs(t - t0) / d);
function cam(z, rot = 0, cx = 540, cy = 960) { g.translate(cx, cy); g.rotate(rot); g.scale(z, z); g.translate(-cx, -cy); }
function big(s, y, size, col, k, o = {}) { if (k > 0) text(s, o.x ?? 540, y, size, 'IDB', col, { alpha: clamp(k * 3) * (o.alpha ?? 1), sc: lerp(o.from || 1.9, 1, eback(k)), mblur: (1 - eo(k)) * 12, ls: o.ls ?? -3, glow: o.glow, blur: 50, stroke: o.stroke ?? 10, strokeColor: o.sc2 || 'rgba(10,6,30,.85)' }); }
const kin = (i, f, d = .35) => t => p(t, at(i, f), at(i, f) + d);

// ---------- Bausteine ----------
const FLARES = (() => { const r = rng(4); return Array.from({ length: 40 }, () => ({ a: r() * 6.283, l: .15 + r() * .4, w: .05 + r() * .12, sp: .5 + r() * 2 })); })();
function sun(x, y, R, t, power = 1) {
  if (power <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  glow(x, y, R * 4, [255, 140, 30], .45 * power); glow(x, y, R * 2.2, [255, 200, 80], .55 * power);
  FLARES.forEach(f => { const a = f.a + Math.sin(t * f.sp) * .2, l = R * (1 + f.l * (.6 + .4 * Math.sin(t * f.sp * 2 + f.a))); g.fillStyle = `rgba(255,${150 + 60 * Math.sin(f.a)},40,${.25 * power})`; g.beginPath(); g.moveTo(x + Math.cos(a - f.w) * R * .95, y + Math.sin(a - f.w) * R * .95); g.quadraticCurveTo(x + Math.cos(a) * l * 1.2, y + Math.sin(a) * l * 1.2, x + Math.cos(a + f.w) * R * .95, y + Math.sin(a + f.w) * R * .95); g.fill(); });
  g.restore();
  const gr = g.createRadialGradient(x - R * .25, y - R * .25, R * .1, x, y, R); gr.addColorStop(0, `rgba(255,255,230,${power})`); gr.addColorStop(.6, `rgba(255,200,70,${power})`); gr.addColorStop(1, `rgba(255,120,20,${power})`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
  g.save(); g.globalAlpha = .18 * power; for (let i = 0; i < 18; i++) { g.fillStyle = i % 2 ? '#ff8a20' : '#fff0a0'; g.beginPath(); g.arc(x + Math.cos(i * 2.1 + t * .4) * R * .55, y + Math.sin(i * 1.7 + t * .3) * R * .55, R * .14, 0, 7); g.fill(); } g.restore();
}
function earth(x, y, r, a = 1, night = 0) {
  g.save(); g.globalAlpha *= a;
  g.save(); g.globalCompositeOperation = 'lighter'; glow(x, y, r * 1.7, [60, 160, 255], .35 * (1 - night)); g.restore();
  const gr = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gr.addColorStop(0, rgb(mix([127, 212, 255], [20, 30, 60], night))); gr.addColorStop(.6, rgb(mix([31, 111, 214], [10, 16, 40], night))); gr.addColorStop(1, rgb(mix([12, 47, 122], [5, 8, 20], night)));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.fillStyle = rgb(mix([80, 200, 120], [30, 50, 60], night), .85); [[-.35, -.2, .32, .22], [.25, .1, .26, .34], [-.1, .45, .2, .14]].forEach(([dx, dy, w, h]) => { g.beginPath(); g.ellipse(x + dx * r, y + dy * r, w * r, h * r, .4, 0, 7); g.fill(); });
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore();
}
function landscape(t, dark = 0, sunY = 520, sunPow = 1) {
  const top = mix([90, 170, 255], [4, 6, 16], dark), hor = mix([255, 200, 120], [8, 10, 24], dark);
  const sky = g.createLinearGradient(0, 0, 0, 1300); sky.addColorStop(0, rgb(top)); sky.addColorStop(1, rgb(hor)); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  sun(800, sunY, 120, t, sunPow * (1 - dark));
  const hills = [[1240, mix([60, 170, 90], [8, 14, 18], dark), .3], [1330, mix([40, 140, 70], [6, 10, 14], dark), .5], [1430, mix([30, 110, 60], [4, 8, 10], dark), .8]];
  hills.forEach(([y, c, sp], k) => { g.fillStyle = rgb(c); g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 20) g.lineTo(x, y + Math.sin(x / 180 + k * 2 + t * sp * .2) * 40); g.lineTo(W, H); g.fill(); });
}
function thermometer(x, y, v, k) {   // v in °C (0 bis −80)
  g.save(); g.globalAlpha = eo(k);
  g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.roundRect(x - 40, y - 520, 80, 560, 40); g.fill(); g.beginPath(); g.arc(x, y + 40, 70, 0, 7); g.fill();
  const h = 480 * clamp((v + 80) / 100), c = mix([255, 80, 60], [90, 200, 255], clamp((15 - v) / 30));
  g.fillStyle = rgb(c); g.shadowColor = rgb(c); g.shadowBlur = 30; g.beginPath(); g.roundRect(x - 22, y - h, 44, h + 20, 22); g.fill(); g.beginPath(); g.arc(x, y + 40, 52, 0, 7); g.fill();
  g.restore();
}
const ICE = (() => { const r = rng(21); return Array.from({ length: 160 }, () => ({ x: r() * W, y: r() * H, s: 6 + r() * 26, ph: r() * 6.28, edge: r() })); })();
function frost(t, k) {
  if (k <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  ICE.forEach(c => { const dEdge = Math.min(c.x, W - c.x, c.y, H - c.y) / 540; if (dEdge > k * 1.1) return; const a = .5 * (1 - dEdge / (k * 1.1 + .001)); g.strokeStyle = `rgba(190,235,255,${a})`; g.lineWidth = 2; g.save(); g.translate(c.x, c.y); g.rotate(c.ph); for (let i = 0; i < 3; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(-c.s, 0); g.lineTo(c.s, 0); g.stroke(); } g.restore(); });
  const v = g.createRadialGradient(540, 960, 400 * (1.6 - k), 540, 960, 1300); v.addColorStop(0, 'rgba(120,200,255,0)'); v.addColorStop(1, `rgba(170,225,255,${.45 * k})`); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
}

// ---------- Szenen (eine pro Satz) ----------
const SC = [];
SC[0] = t => {   // Hook: brodelnde Sonne, flackert kurz aus
  bg([[0, '#3a0a00'], [.5, '#7a1e00'], [1, '#1a0500']]);
  const flick = (t > 1.2 && t < 1.45) || (t > 1.6 && t < 1.68) ? .08 : 1;
  g.save(); cam(1.35 - t * .08 + (punch(t, .45, .2) - 1), t * .05); sun(540, 820, 340, t, flick); g.restore();
  if (flick < 1) { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H); }
  big('WAS WÄRE, WENN', 300, 104, '#ffffff', p(t, .45, .8));
  big('DIE SONNE', 1200, 150, '#ffd23f', p(t, at(0, .45), at(0, .45) + .35), { glow: 'rgba(255,190,40,.6)' });
  big('AUSGEHT?', 1350, 150, '#ff6a2a', p(t, at(0, .75), at(0, .75) + .35), { glow: 'rgba(255,100,30,.6)' });
};
SC[1] = t => {   // Du merkst nichts
  const u = t - S_[1][0];
  g.save(); cam(1.05 + u * .04, -u * .01); landscape(t); g.restore();
  // entspannte Figur mit Sonnenbrille
  g.save(); g.translate(540, 1240); g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(0, -150, 60, 0, 7); g.fill(); g.fillStyle = '#1a1030'; g.fillRect(-48, -170, 96, 26); g.fillStyle = '#ff5ac8'; g.beginPath(); g.roundRect(-60, -90, 120, 150, 40); g.fill(); g.restore();
  big('DU MERKST:', 260, 100, '#ffffff', kin(1, .05)(t));
  big('NICHTS!', 390, 170, '#ffd23f', kin(1, .45)(t), { glow: 'rgba(255,200,60,.6)' });
};
SC[2] = t => {   // Licht braucht 8 Minuten
  const u = t - S_[2][0], dur = S_[3][0] - S_[2][0];
  bg([[0, '#1a0640'], [.5, '#3a0a5a'], [1, '#0a0420']]); stars(t, .8, t * .2);
  g.save(); cam(1.02 + u * .03);
  sun(180, 960, 130, t); earth(930, 960, 70);
  const k = eio(p(u, .2, dur));
  beam(320, 960, lerp(320, 860, k), 960, 8, [255, 230, 150]);
  g.save(); g.globalCompositeOperation = 'lighter'; glow(lerp(320, 860, k), 960, 60, [255, 240, 180], 1); g.restore();
  g.restore();
  const secs = Math.floor(lerp(0, 500, k));
  big(`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, 560, 200, '#ffd23f', kin(2, .1)(t), { glow: 'rgba(255,200,60,.6)', ls: -4 });
  big('150 Mio. km', 1170, 60, '#ffffff', kin(2, .4)(t), { ls: 1 });
};
SC[3] = t => {   // 8 Minuten normal, dann Schwarz
  const u = t - S_[3][0];
  if (t < BLACK) {
    g.save(); cam(1.04 + u * .05); landscape(t, 0, 760 + u * 30); g.restore();
    const left = Math.max(0, 480 * (1 - p(t, S_[3][0] + .2, BLACK)));
    big(`${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`, 330, 210, '#ffffff', kin(3, .02)(t), { ls: -4, glow: 'rgba(255,255,255,.4)' });
    big('ALLES NORMAL', 470, 70, '#ffd23f', kin(3, .15)(t), { ls: 2 });
  } else {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.save(); cam(punch(t, BLACK, .3, .4)); landscape(t, 1, 520, 0); g.restore();
    big('SCHWARZ.', 900, 210, '#ffffff', p(t, BLACK, BLACK + .3), { ls: -6, glow: 'rgba(255,255,255,.35)', from: 3 });
  }
};
SC[4] = t => {   // Auch der Mond verschwindet
  const u = t - S_[4][0], fade = 1 - eio(p(t, at(4, .2), at(4, .5)));
  bg([[0, '#02030a'], [1, '#060818']]); stars(t, .9, t * .1);
  g.save(); cam(1.1 - u * .02, u * .02);
  g.save(); g.globalAlpha = fade; g.globalCompositeOperation = 'lighter'; glow(540, 760, 420, [200, 210, 255], .5); g.restore();
  g.fillStyle = `rgba(230,232,245,${fade})`; g.beginPath(); g.arc(540, 760, 210, 0, 7); g.fill();
  g.fillStyle = `rgba(160,160,190,${fade * .8})`; [[-60, -40, 40], [50, 30, 55], [-20, 90, 30], [80, -80, 25]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(540 + dx, 760 + dy, r, 0, 7); g.fill(); });
  g.restore();
  big('MOND:', 1180, 110, '#ffffff', kin(4, .15)(t));
  big('WEG!', 1320, 190, '#7af0ff', kin(4, .32)(t), { glow: 'rgba(120,240,255,.6)' });
  if (u > (S_[4][1] - S_[4][0]) * .55) text('Er spiegelt nur Sonnenlicht', 540, 300, 50, 'IDX', 'rgba(255,255,255,.85)', { alpha: eo(p(t, at(4, .55), at(4, .7))) });
};
SC[5] = t => {   // Re-Hook: der Schock
  const u = t - S_[5][0];
  bg([[0, '#ff1a4a'], [.5, '#7a0030'], [1, '#14020a']]);
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283 + u * 1.2; g.fillStyle = `rgba(255,255,255,${i % 2 ? .05 : .1})`; g.beginPath(); g.moveTo(540, 960); g.lineTo(540 + Math.cos(a) * 1700, 960 + Math.sin(a) * 1700); g.lineTo(540 + Math.cos(a + .11) * 1700, 960 + Math.sin(a + .11) * 1700); g.fill(); } g.restore();
  big('JETZT KOMMT', 760, 100, '#ffffff', p(t, S_[5][0] + .05, S_[5][0] + .35));
  big('DER SCHOCK', 920, 170, '#ffd23f', p(t, at(5, .5), at(5, .5) + .35), { glow: 'rgba(255,200,60,.7)', from: 2.6 });
};
SC[6] = t => {   // Nichts hält die Erde auf der Bahn
  const u = t - S_[6][0], gone = eo(p(t, at(6, .1), at(6, .4)));
  bg([[0, '#06021a'], [1, '#120a3a']]); stars(t, .8);
  g.save(); cam(1 + u * .04, u * .03);
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.setLineDash([14, 16]); g.lineWidth = 4; g.beginPath(); g.arc(540, 960, 380, 0, 7); g.stroke(); g.setLineDash([]);
  sun(540, 960, 110, t, 1 - gone);
  const a = -Math.PI / 2 + u * .5, ex = 540 + Math.cos(a) * 380, ey = 960 + Math.sin(a) * 380;
  if (gone < 1) arrow(ex, ey, lerp(ex, 540, .55), lerp(ey, 960, .55), [255, 200, 80], 10, 1 - gone);
  earth(ex, ey, 60);
  g.restore();
  big('KEINE SONNE', 260, 110, '#ffffff', kin(6, .05)(t));
  big('KEIN HALT', 390, 130, '#ff4a5e', kin(6, .45)(t), { glow: 'rgba(255,60,90,.6)' });
};
SC[7] = t => {   // Erde fliegt geradeaus ins All
  const u = t - S_[7][0], dur = S_[8][0] - S_[7][0];
  bg([[0, '#0a0420'], [1, '#1a0640']]);
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 120; i++) { const y = (i * 137) % H, sp = 1 + (i % 5), x = ((i * 271) - u * 900 * sp) % (W + 400); g.strokeStyle = `rgba(200,220,255,${.15 + (i % 4) * .08})`; g.lineWidth = 2 + (i % 3); g.beginPath(); g.moveTo((x + W + 400) % (W + 400) - 200, y); g.lineTo((x + W + 400) % (W + 400) - 200 + 60 * sp, y); g.stroke(); } g.restore();
  g.save(); cam(1.1 + Math.sin(u * 8) * .01); earth(540, 900, 230); g.restore();
  const v = Math.round(107000 * eio(p(t, at(7, .45), at(7, .85))));
  big(v.toLocaleString('de-DE'), 1380, 160, '#ffffff', kin(7, .45)(t), { ls: -4, glow: 'rgba(120,200,255,.6)' });
  big('km/h', 1510, 60, '#7af0ff', kin(7, .5)(t), { ls: 4 });
  big('GERADEAUS INS ALL', 260, 80, '#ffd23f', kin(7, .05)(t), { ls: 0 });
};
SC[8] = t => {   // Es wird kalt
  const u = t - S_[8][0];
  bg([[0, '#0a2a5a'], [.6, '#06183a'], [1, '#020814']]);
  g.save(); cam(1.05 + u * .05); earth(540, 980, 300, 1, .6); g.restore();
  frost(t, eo(p(u, 0, 2.2)));
  big('KALT.', 520, 200, '#bfeaff', kin(8, .05)(t), { glow: 'rgba(170,230,255,.6)' });
  big('RICHTIG KALT.', 700, 110, '#ffffff', kin(8, .55)(t), { from: 2.4 });
};
const tempScene = (i, from, to, label) => t => {
  const u = t - S_[i][0], k = eio(p(t, at(i, .3), at(i, .9)));
  bg([[0, '#0a3a6a'], [.6, '#082450'], [1, '#020a1a']]);
  frost(t, .7 + .3 * k);
  g.save(); cam(1.04 + u * .04); thermometer(330, 1250, lerp(from, to, k), p(t, S_[i][0], S_[i][0] + .3)); g.restore();
  big(label, 300, 96, '#ffffff', kin(i, .02)(t), { x: 600 });
  big(`${Math.round(lerp(from, to, k))} °C`, 860, 200, '#7af0ff', kin(i, .3)(t), { x: 680, glow: 'rgba(120,230,255,.6)', ls: -4 });
};
SC[9] = tempScene(9, 15, -18, 'NACH 1 WOCHE');
SC[10] = tempScene(10, -18, -70, 'NACH 1 JAHR');
SC[11] = t => {   // Meere frieren, Pflanzen sterben
  const u = t - S_[11][0], k = eio(p(t, at(11, .05), at(11, .45)));
  bg([[0, '#06142e'], [.45, '#0a2a5a'], [.46, '#0a3a6a'], [1, '#04101e']]);
  g.save(); cam(1.05 + u * .03);
  // Meeresoberfläche, die von außen zufriert
  for (let y = 900; y < 1500; y += 24) { g.fillStyle = `rgba(80,160,230,${.25})`; g.fillRect(0, y + Math.sin(y / 30 + u * 2) * 6, W, 8); }
  // Eisschollen wachsen von beiden Seiten, mit Rissen
  const R2 = rng(77);
  [[0, 1], [W, -1]].forEach(([x0, dir]) => {
    for (let row = 0; row < 8; row++) {
      const y = 890 + row * 78, reach = W * .52 * k * (.75 + R2() * .35), j = 30 + R2() * 40;
      const gr = g.createLinearGradient(x0, y, x0 + dir * reach, y); gr.addColorStop(0, 'rgba(240,250,255,.97)'); gr.addColorStop(1, 'rgba(170,220,250,.85)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(x0, y - 4);
      for (let s2 = 0; s2 <= 6; s2++) g.lineTo(x0 + dir * reach * s2 / 6, y - 4 + (R2() - .5) * j * .4);
      g.lineTo(x0 + dir * (reach + j * .6), y + 38); 
      for (let s2 = 6; s2 >= 0; s2--) g.lineTo(x0 + dir * reach * s2 / 6, y + 80 + (R2() - .5) * j * .4);
      g.closePath(); g.fill();
      g.strokeStyle = 'rgba(120,180,220,.7)'; g.lineWidth = 3; g.beginPath(); let cx2 = x0 + dir * reach * R2() * .8; g.moveTo(cx2, y); for (let q = 0; q < 4; q++) { cx2 += dir * (10 + R2() * 30); g.lineTo(cx2, y + q * 22 + R2() * 10); } g.stroke();
    }
  });
  g.save(); g.globalCompositeOperation = 'lighter'; glow(540 + Math.sin(u * 3) * 200, 1100, 240, [200, 240, 255], .25 * k); g.restore();
  // welkende Pflanze
  const wilt = eo(p(t, at(11, .5), at(11, .95)));
  g.save(); g.translate(540, 1700); g.strokeStyle = rgb(mix([80, 220, 120], [120, 100, 70], wilt)); g.lineWidth = 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(0, -120, 80 * wilt, -200 + 90 * wilt); g.stroke();
  g.fillStyle = rgb(mix([80, 220, 120], [120, 100, 70], wilt)); g.beginPath(); g.ellipse(-40, -110 + 40 * wilt, 50, 22, -.5 + wilt, 0, 7); g.fill(); g.beginPath(); g.ellipse(50, -150 + 50 * wilt, 50, 22, .5 + wilt, 0, 7); g.fill(); g.restore();
  g.restore();
  big('MEERE FRIEREN', 300, 104, '#ffffff', kin(11, .05)(t));
  big('PFLANZEN STERBEN', 430, 80, '#ff8a8a', kin(11, .5)(t), { ls: 0 });
};
SC[12] = t => {   // Twist: Tauchfahrt in die Tiefsee
  const u = t - S_[12][0], dive = eio(p(u, 0, 2.2));
  const top = mix([30, 120, 200], [10, 0, 40], dive), bot = mix([10, 40, 90], [40, 0, 60], dive);
  bg([[0, rgb(top)], [1, rgb(bot)]]);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) { const x = (i * 173) % W, y = ((i * 311) - u * 600 * (1 + i % 3)) % H; glow(x, (y + H) % H, 10 + (i % 4) * 4, [150, 220, 255], .4); }
  for (let i = 0; i < 9; i++) { const a = u * .6 + i * .7; glow(540 + Math.cos(a) * 340, 1100 + Math.sin(a * 1.3) * 260, 70, i % 2 ? [255, 60, 200] : [60, 240, 255], .5 * dive); }
  g.restore();
  big('HIER IST', 640, 110, '#ffffff', p(t, S_[12][0] + .05, S_[12][0] + .35));
  big('DER TWIST', 800, 170, '#ff5ac8', p(t, at(12, .12), at(12, .12) + .35), { glow: 'rgba(255,90,200,.7)', from: 2.6 });
  big('LEBEN OHNE SONNE', 1360, 76, '#7af0ff', kin(12, .65)(t), { ls: 1 });
};
SC[13] = t => {   // heiße Quellen
  const u = t - S_[13][0];
  bg([[0, '#1a0040'], [.6, '#0a0030'], [1, '#2a0820']]);
  g.save(); cam(1.08 + u * .05, Math.sin(u) * .02);
  // Schlot
  g.fillStyle = '#2a1a30'; g.beginPath(); g.moveTo(380, 1700); g.lineTo(480, 1100); g.lineTo(600, 1100); g.lineTo(700, 1700); g.fill();
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 40; i++) { const k = ((u * .45 + i / 40) % 1), x = 540 + Math.sin(i * 3 + u * 2) * 60 * k; glow(x, 1100 - k * 900, 40 + k * 90, [255, 120 + 60 * k, 60], .35 * (1 - k)); }
  glow(540, 1110, 220, [255, 140, 60], .8);
  [[300, 1600, [255, 60, 200]], [780, 1560, [60, 240, 255]], [240, 1450, [140, 255, 120]], [840, 1420, [255, 200, 60]]].forEach(([x, y, c], i) => { for (let s = 0; s < 6; s++) { const yy = y - s * 26, xx = x + Math.sin(u * 3 + s + i) * 10; glow(xx, yy, 18, c, .7); } });
  g.restore(); g.restore();
  big('HEISSE QUELLEN', 280, 100, '#ffffff', kin(13, .05)(t));
  big('AM MEERESGRUND', 400, 74, '#ffd23f', kin(13, .3)(t), { ls: 1 });
};
SC[14] = t => {   // Pointe: 5 Milliarden Jahre
  const u = t - S_[14][0], back = eo(p(u, 0, .8));
  bg([[0, '#ff8a2a'], [.5, '#ff3a6a'], [1, '#3a0a5a']]);
  g.save(); cam(1.2 - back * .15 + u * .02); sun(540, 1000, 300, t, back); g.restore();
  const n = Math.round(5e9 * eio(p(t, at(14, .45), at(14, .9))));
  big('ZUM GLÜCK', 260, 110, '#ffffff', kin(14, .02)(t));
  big(n.toLocaleString('de-DE'), 1330, 120, '#ffffff', kin(14, .45)(t), { ls: -3, glow: 'rgba(255,220,120,.7)' });
  big('JAHRE', 1450, 70, '#ffd23f', kin(14, .5)(t), { ls: 6 });
  const ke = p(t, END, END + .45);
  if (ke > 0) {
    g.fillStyle = `rgba(20,4,30,${eo(ke)})`; g.fillRect(0, 0, W, H);
    g.save(); g.font = '170px IDB'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '-5px';
    const gr = g.createLinearGradient(140, 0, 940, 0); gr.addColorStop(0, '#ffd23f'); gr.addColorStop(.5, '#ff6a2a'); gr.addColorStop(1, '#ff3a8a');
    g.fillStyle = gr; g.globalAlpha = eo(ke); g.translate(540, 840); const s = lerp(1.3, 1, eback(ke)); g.scale(s, s);
    g.fillText('KEINE', 0, -90); g.fillText('SORGE.', 0, 90); g.restore();
    text('Die Sonne bleibt uns noch lange.', 540, 1080, 48, 'IDS', '#ffffff', { alpha: eo(p(t, END + .3, END + .8)) });
  }
};
function scene(t) {
  let i = 0; while (i < NS - 1 && t >= S_[i + 1][0]) i++;
  SC[i](t);
}
