<script>

window.CFG = {
  REPL: [['vierundzwanzig Stunden', '24 Stunden'], ['einem Promille', 'einem Promille'], ['siebzehnjähriger', '17-jähriger'], ['elf Tage', '11 Tage'], ['Zweihundertvierundsechzig Stunden', '264 Stunden'], ['vierzehn Stunden', '14 Stunden'], ['zwei bis drei Wochen', '2 bis 3 Wochen']],
  LOOP: true, DUR: TIMING.dur, CUTS: S_.slice(1).map(s => s[0]), PHRASES: TIMING.phrases, CAP_END: END,
  KEY: /^(Woche|schläfst|24|Promille|Alkohol|Gehirn|Sekunden|Abfallstoffe|Müll|vierten|Dinge|17|Randy|Gardner|11|264|Wach-Rekord|vergaß|Flipper|14|fit|nachmachen|Ratten|2|3|Wochen|versinken)/,

<script>

const kin = (i, f, d = .35) => t => p(t, at(i, f), at(i, f) + d);
const fmt = n => Math.round(n).toLocaleString('de-DE');

const camLerp = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));

// ---------- 3D-Bühnen ----------

  const face = new T.Mesh(new T.CircleGeometry(.82, 32), new T.MeshBasicMaterial({ color: 0xfff8e8 })); face.position.z = .26; grp.add(face);

  bg([[0, '#3a1a8a'], [1, '#ff5a8a']]);
  CB.cubes.forEach((c, i) => { const k = eback(clamp(p(t, S_[7][0] + .1 + i * .16, S_[7][0] + .45 + i * .16))); c.position.set(Math.sin(i * 1.7) * .25, -6 + i * 1.15 + (1 - k) * 12, 0); c.rotation.y = i * .25 + u * .4; c.visible = k > .01; });

SC[8] = t => {   // Folgen: Wörter zerfallen in Pixel, Fragezeichen poppen
  const u = t - S_[8][0], vg = S_[8][0] + .2, pb = ph('aber gegen');

    g.restore(); }

SC[9] = t => {   // 14 Stunden Schlaf im Zeitraffer: Mond und Sonne ziehen am Fenster vorbei, Wecker rast, Eula schläft
  const u = t - S_[9][0], k = eio(p(t, S_[9][0], S_[10][0])), day = clamp(Math.sin(k * Math.PI) * 1.4);

SC[10] = t => {   // Warnung: rotes Warnschild schlägt ein, Pokal wird durchgestrichen

    g.beginPath(); g.ellipse(0, 0, 120, 62, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(120, -20, 56, 40, -.3, 0, 7); g.fill(); g.beginPath(); g.arc(100, -62, 22, 0, 7); g.fill();
    g.strokeStyle = '#e8e0f0'; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(-115, 10); g.quadraticCurveTo(-230, 40 + Math.sin(u * 4) * 20, -260, -40); g.stroke(); g.fillStyle = '#1a0a0a'; g.beginPath(); g.arc(140, -28, 8, 0, 7); g.fill(); g.restore(); }
  big('2–3 WOCHEN', 300, 110, '#ffffff', p(t, gn + .5, gn + .85), { sc2: 'rgba(90,0,10,.85)' });

SC[11] = t => {   // Pointe und Schleife: zurück ins Schlafzimmer, Kamera fährt zur Startposition, Eula reißt die Augen auf
  const fr = ph('Dein Gehirn würde'), k = eio(p(t, S_[11][0], TIMING.dur));

  const mk = p(t, fr, fr + .8) * (1 - p(t, TIMING.dur - 1.2, TIMING.dur - .2)); for (let i = 0; i < 60; i++) { if (mk <= 0) break; g.fillStyle = `rgba(130,120,110,${.75 * mk})`; g.beginPath(); g.arc((i * 151) % W, H - ((i * 97 + (t - fr) * 160) % (H * .8)), 12 + (i % 4) * 5, 0, 7); g.fill(); }
