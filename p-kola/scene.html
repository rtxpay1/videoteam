<script>
window.READY3D = new Promise(r => window.__ready3d = r);
const TIMING = __TIMING__;
const S_ = TIMING.sentences, NS = S_.length;
const at = (i, f) => S_[i][0] + (S_[i][1] - S_[i][0]) * f;
const END = S_[NS - 1][1] + .2;
const ph = w => (TIMING.phrases.find(x => x[2].includes(w)) || [Infinity])[0];   // Startzeit des Teilsatzes mit diesem Wort
const HOT = ph('fast doppelt'), DIVE = at(8, .75);
window.CFG = {
  REPL: [['dreiundzwanzig Zentimeter', '23 Zentimeter'], ['Neunzehn Jahre', '19 Jahre'], ['zwölf Kilometer', '12 Kilometer'], ['sechs Kilometer', '6 Kilometer'], ['hundertachtzig Grad', '180 Grad'], ['neunzehnhundertzweiundneunzig', '1992'], ['null Komma zwei Prozent', '0,2 Prozent'], ['hundert Kilometern', '100 Kilometern'], ['über tausend Grad', 'über 1000 Grad'], ['fünftausend Grad', '5000 Grad'], ['zehntausend Jahre', '10.000 Jahre']],
  LOOP: true, DUR: TIMING.dur, CUTS: S_.slice(1).map(s => s[0]), PHRASES: TIMING.phrases, CAP_END: END,
  KEY: /^(tiefste|Loch|weiterbohrst|Kola|23|19|12|Marianengraben|Everest|versteinerte|Meereswesen|6|180|doppelt|Knete|1992|Schluss|0,2|Erdmittelpunkt|weiter|100|Erdmantel|1000|glüht|Erdkern|5000|Sonne|10.000|Frage)/,
  split: t => 24 * (1 - p(t, 0, .6)) + 24 * p(t, TIMING.dur - .6, TIMING.dur) + 26 * Math.max(0, 1 - Math.abs(t - DIVE) / .3) + 14 * Math.max(0, 1 - Math.abs(t - HOT) / .3),
  shake: t => (t > DIVE && t < DIVE + .7 ? 18 * (1 - (t - DIVE) / .7) : 0) + (t > HOT && t < HOT + .5 ? 10 * (1 - (t - HOT) / .5) : 0) + (t > S_[9][0] && t < S_[10][0] ? 2 + 2 * Math.sin(t * 23) : 0),
};

<script>
function big(s, y, size, col, k, o = {}) { if (k > 0) text(s, o.x ?? 540, y, size, 'IDB', col, { alpha: clamp(k * 3) * (o.alpha ?? 1), sc: lerp(o.from || 1.9, 1, eback(k)), mblur: (1 - eo(k)) * 12, ls: o.ls ?? -3, glow: o.glow, blur: 50, stroke: o.stroke ?? 10, strokeColor: o.sc2 || 'rgba(10,6,30,.85)', rot: o.rot }); }
const kin = (i, f, d = .35) => t => p(t, at(i, f), at(i, f) + d);
function stamp(s, x, y, size, col, k, rot = -.12) {
  if (k <= 0) return; const e = eback(clamp(k));
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(lerp(2.4, 1, e), lerp(2.4, 1, e)); g.globalAlpha = clamp(k * 3);
  g.font = `${size}px IDB`; g.letterSpacing = '4px'; const w = g.measureText(s).width;
  g.strokeStyle = col; g.lineWidth = 10; g.beginPath(); g.roundRect(-w / 2 - 34, -size * .72, w + 68, size * 1.44, 16); g.stroke();
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, 0, 4); g.restore();
}
const fmt = n => Math.round(n).toLocaleString('de-DE');
const draw3d = st => g.drawImage(FX3D.render(st), 0, 0, W, H);
const toScreen = (st, v) => { const q = v.clone().project(st.cam); return [(q.x + 1) / 2 * W, (1 - q.y) / 2 * H]; };
const SKY = [[0, '#3a6aff'], [.55, '#9ac8ff'], [1, '#e8f4ff']];

// ---------- 3D-Bühnen ----------
let A = null, P = null, X = null, SH = null;   // Schneefeld mit Loch + Bohrturm, Planet mit Stecknadel, Erd-Querschnitt, Bohrschacht
function tower(F, T) {   // Bohrturm aus Stahlstreben, rot-weiß
  const grp = new T.Group(), red = F.toon(0xff4a5a), white = F.toon(0xf4f0ff);
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([x, z]) => {
    const top = new T.Vector3(x * .35, 9, z * .35), bot = new T.Vector3(x * 1.6, 0, z * 1.6), m = F.solid(new T.CylinderGeometry(.1, .1, top.distanceTo(bot), 5), red, .12);
    m.position.copy(top.clone().add(bot).multiplyScalar(.5)); m.lookAt(top); m.rotateX(Math.PI / 2); grp.add(m);
  });

  const cab = F.solid(new T.BoxGeometry(2.6, 1.4, 2.2), F.toon(0x5a7aff), .05); cab.position.set(2.6, .7, 0); grp.add(cab);
  const top = F.solid(new T.BoxGeometry(1, .6, 1), F.toon(0xffd23f, { emissive: 0xffa000, ei: .3 }), .08); top.position.y = 9.2; grp.add(top);
  return grp;
}
function setup3d() {
  const F = FX3D, T = F.THREE;
  // A: Schneefeld auf Kola mit dem Bohrloch, Bohrturm und Eula
  A = F.stage({ dist: 14, fov: 40 });
  A.add(F.solid(new T.CylinderGeometry(40, 40, .4, 40), F.toon(0xeef6ff), 0)).position.y = -.2;
  [[-6, -4, 2], [5, -6, 2.6], [-9, -10, 3], [8, 2, 1.6], [-4, 3, 1.2]].forEach(([x, z, r]) => { const m = A.add(F.solid(new T.SphereGeometry(r, 16, 10), F.toon(0xffffff), .03)); m.scale.y = .35; m.position.set(x, 0, z); });
  const hole = A.add(new T.Mesh(new T.CircleGeometry(.7, 28), new T.MeshBasicMaterial({ color: 0x0a0414 }))); hole.rotation.x = -Math.PI / 2; hole.position.y = .02;
  A.glow = A.add(new T.Mesh(new T.CircleGeometry(.38, 24), new T.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: .6 }))); A.glow.rotation.x = -Math.PI / 2; A.glow.position.y = .03;
  const rim = A.add(F.solid(new T.TorusGeometry(.72, .1, 6, 28), F.toon(0x6a6a8a), .1)); rim.rotation.x = Math.PI / 2; rim.position.y = .05;
  A.tower = A.add(tower(F, T)); A.tower.position.set(4.5, 0, -3.5);
  A.eula = A.add(F.eula()); A.eula.position.set(-2, 1.8, .6);
  A.drill = A.add(F.solid(new T.ConeGeometry(.55, 1.8, 10), F.toon(0xb8c0d8, { emissive: 0xff6a00, ei: 0 }), .08)); A.drill.rotation.x = Math.PI; A.drill.visible = false;
  // P: Planet mit Stecknadel auf der Halbinsel Kola (ca. 68° Nord)
  P = F.stage({ dist: 22 }); P.planet = P.add(F.planet(4.2));
  const n = new T.Vector3(0, Math.sin(68 * Math.PI / 180), Math.cos(68 * Math.PI / 180)); P.pin = new T.Group();
  const stick = F.solid(new T.CylinderGeometry(.05, .05, .9, 6), F.toon(0xffffff), .1); stick.position.y = .45; P.pin.add(stick);
  const head = F.solid(new T.SphereGeometry(.26, 14, 10), F.toon(0xff2a5a, { emissive: 0xff2a5a, ei: .4 }), .1); head.position.y = .95; P.pin.add(head);
  P.pin.position.copy(n.clone().multiplyScalar(4.15)); P.pin.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), n); P.planet.add(P.pin);
  // X: Erde im Querschnitt (hintere Halbkugel + Schicht-Scheiben), Eula daneben
  X = F.stage({ dist: 26 }); X.earth = X.add(new T.Group());
  X.earth.add(F.solid(new T.SphereGeometry(4.2, 48, 32, Math.PI, Math.PI), F.toon(0x2a9cf0), .03));
  [[4.2, 0x7a5a3a, 0], [4.05, 0xe0582a, .25], [2.3, 0xff9a2a, .55], [1.25, 0xfff0a0, .9]].forEach(([r, c, e], i) => { const d = new T.Mesh(new T.CircleGeometry(r, 64), new T.MeshBasicMaterial({ color: new T.Color(c).multiplyScalar(.8 + e * .25) })); d.position.z = .02 + i * .03; X.earth.add(d); });
  X.eula = X.add(F.eula()); X.eula.scale.setScalar(.8); X.eula.position.set(4.3, -4.6, 3);
  // SH: Bohrschacht von innen, Farben je nach Tiefe, Ringe zeigen die Geschwindigkeit
  SH = F.stage({ dist: 1, fov: 75 });
  const tube = new T.CylinderGeometry(2, 2, 130, 20, 130, true), tp = tube.attributes.position, tc = new Float32Array(tp.count * 3), cc = new T.Color();
  const STOPS = [[0, 0x8a8aa0], [-20, 0x7a5a4a], [-50, 0xc8502a], [-85, 0xff7a1a], [-130, 0xffd040]];
  for (let i = 0; i < tp.count; i++) {
    const y = tp.getY(i) - 65; let k = 0; while (k < STOPS.length - 2 && y < STOPS[k + 1][0]) k++;
    const [y0, c0] = STOPS[k], [y1, c1] = STOPS[k + 1]; cc.set(c0).lerp(new T.Color(c1), clamp((y - y0) / (y1 - y0))); const n2 = .85 + .15 * Math.sin(i * 1.7); tc.set([cc.r * n2, cc.g * n2, cc.b * n2], i * 3);
  }
  tube.setAttribute('color', new T.BufferAttribute(tc, 3));
  SH.tube = SH.add(new T.Mesh(tube, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide }))); SH.tube.position.y = -65;
  SH.rings = Array.from({ length: 22 }, (_, i) => { const r = SH.add(new T.Mesh(new T.TorusGeometry(1.98, .06, 4, 24), new T.MeshBasicMaterial({ color: 0x1a0a14 }))); r.rotation.x = Math.PI / 2; r.position.y = -i * 6; return r; });
  SH.bit = SH.add(F.solid(new T.ConeGeometry(.7, 1.8, 10), F.toon(0x6a7090, { emissive: 0xff4a00, ei: 0 }), .06)); SH.bit.rotation.x = Math.PI;
  SH.rod = SH.add(F.solid(new T.CylinderGeometry(.12, .12, 5, 8), F.toon(0x8a90a8), .06));
}
// Schneefeld-Ansicht: Kamera von (c0) nach (c1) mit Blickpunkt
function snowShot(cp, look, o = {}) {
  if (!A) setup3d();
  A.glow.material.opacity = .35 + .25 * Math.sin(o.t * 4) + (o.glow || 0);
  A.cam.position.set(...cp); A.cam.lookAt(...look); draw3d(A);
  // Schneefall (2D), gleiche Flocken bei jedem Render; läuft über die Videolänge in einer Schleife
  const T0 = o.t % TIMING.dur; g.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 70; i++) { const sp = 60 + (i * 37) % 90, x = ((i * 157) % W) + Math.sin(T0 * 1.3 + i) * 20, y = ((i * 263 + T0 * sp) % (H + 40)) - 20; g.beginPath(); g.arc(x, y, 3 + (i % 4), 0, 7); g.fill(); }
}
// Schacht-Ansicht: Kamera in Tiefe y (negativ), Bohrkopf darunter
function shaftShot(t, y, o = {}) {
  if (!SH) setup3d();
  SH.cam.position.set(Math.sin(t * 1.3) * .3, y, Math.cos(t * 1.1) * .3); SH.cam.lookAt(0, y - 10, 0);
  SH.bit.position.set(0, y - 8, 0); SH.bit.rotation.y = t * (o.spin ?? 14); SH.rod.position.set(0, y - 5.5, 0);
  SH.bit.userData.mesh.material.emissiveIntensity = o.heat ?? 0;
  SH.tube.scale.set(o.squeeze ?? 1, 1, o.squeeze ?? 1); SH.rings.forEach(r => r.scale.set(o.squeeze ?? 1, o.squeeze ?? 1, 1));
  draw3d(SH);
}
const C0 = [3.5, 8.5, 19], L0 = [-.4, 1.4, 0], C1 = [1.2, 4.6, 14], L1 = [-.6, 1.4, 0];
const camLerp = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));

// ---------- Szenen (eine pro Satz) ----------
const SC = [];
SC[0] = t => {   // Hook: Eula steht am winzigen Bohrloch im Schnee, Kamera fährt heran
  bg(SKY); stars(t, .2);
  const k = eio(p(t, 0, S_[1][0]));
  A || setup3d(); A.eula.pose(t, { mood: t < .9 ? 'idle' : t < at(0, .7) ? 'point' : 'wow', dir: 1, look: [.6, -.6], k: t < .9 ? 1 : eo(p(t, .9, 1.2)) });
  snowShot(camLerp(C0, C1, k), camLerp(L0, L1, k), { t, glow: .3 * p(t, at(0, .6), at(0, .8)) });
  big('WAS WÄRE, WENN', 260, 96, '#ffffff', p(t, .2, .55), { sc2: 'rgba(20,30,90,.85)' });
  big('WEITERBOHREN?', 1430, 110, '#ffd23f', p(t, at(0, .6), at(0, .6) + .3), { glow: 'rgba(255,210,60,.7)' });
};
SC[1] = t => {   // Globus-Zoom auf Kola, dann Strichzeichnung: nur 23 cm breit
  if (!P) setup3d();
  const u = t - S_[1][0], cm = ph('dreiundzwanzig'), k = eio(p(t, S_[1][0], cm));
  bg([[0, '#0a1a4a'], [1, '#02061a']]); stars(t, .8);
  P.planet.rotation.set(.15, lerp(-2.6, 0, k), 0); P.pin.scale.setScalar(popIn(p(t, cm - .6, cm - .2)) || .001);
  P.cam.position.set(0, lerp(1, 5, k), lerp(22, 15, k)); P.cam.lookAt(0, lerp(0, 2.6, k), 0); draw3d(P);
  big('KOLA, RUSSLAND', 300, 100, '#ffffff', kin(1, .05)(t), { sc2: 'rgba(10,20,80,.85)' });
  iris(p(t, cm, cm + .5), 540, 900, () => {
    bg([[0, '#1a1030'], [1, '#2a1a50']]);
    g.save(); g.fillStyle = '#0a0414'; g.beginPath(); g.arc(540, 900, 230 * eo(p(t, cm + .2, cm + .6)), 0, 7); g.fill(); g.restore();
    drawOn([[[0, .5], [1, .5]], [[0, .4], [0, .6]], [[1, .4], [1, .6]]], eio(p(t, cm + .4, cm + 1.1)), 540, 1180, 460, 80, '#ffd23f', 8);
    big('23 CM', 1310, 120, '#ffd23f', p(t, cm + .9, cm + 1.2), { glow: 'rgba(255,210,60,.6)' });
    text('so breit wie ein Teller', 540, 560, 54, 'IDX', 'rgba(255,255,255,.85)', { alpha: eo(p(t, cm + 1.1, cm + 1.5)) });
  }, { ring: '#ffd23f' });
};
SC[2] = t => {   // Bohrturm im Schnee, Zähler Jahre und Tiefe
  const u = t - S_[2][0], k = eio(p(t, S_[2][0] + .1, S_[3][0] - .3));
  bg([[0, '#ff9a6a'], [.6, '#ffc8a0'], [1, '#f0f0ff']]);
  A || setup3d(); A.eula.pose(t, { mood: 'think', look: [.8, .6] });
  snowShot([4.5 + Math.sin(u * .4) * 5, 3 + u * .5, 17], [3.5, 4 + u * .3, -3.5], { t });
  big(String(Math.round(lerp(1970, 1989, k))), 280, 130, '#ffffff', kin(2, .02)(t), { sc2: 'rgba(90,30,10,.85)', ls: -2 });
  big(fmt(12262 * k) + ' m', 430, 100, '#ffd23f', kin(2, .15)(t), { sc2: 'rgba(90,30,10,.85)', glow: 'rgba(255,210,60,.5)' });
  big('19 JAHRE BOHREN', 1440, 84, '#ffffff', kin(2, .45)(t), { sc2: 'rgba(90,30,10,.85)' });
};
SC[3] = t => {   // Vergleich: Everest nach oben, Marianengraben und Kola nach unten (gleicher Maßstab)
  const u = t - S_[3][0], ev = ph('Everest'), gy = 860, km = 48, cx = 540 + Math.sin(u * .8) * 20;
  bg([[0, '#2a7aff'], [gy / H, '#9ad0ff'], [gy / H + .001, '#5a3a2a'], [1, '#2a140a']]);
  g.fillStyle = '#1a4a8a'; g.beginPath(); g.moveTo(cx - 60, gy); g.lineTo(cx + 40, gy); const md = 10.99 * km * eio(p(t, S_[3][0] + .2, ev - .2)); g.lineTo(cx + 10, gy + md); g.lineTo(cx - 20, gy + md); g.closePath(); g.fill();
  const eh = 8.85 * km * eback(clamp(p(t, ev, ev + .6))); g.fillStyle = '#e8eef8'; g.beginPath(); g.moveTo(cx - 400, gy); g.lineTo(cx - 250, gy - eh); g.lineTo(cx - 110, gy); g.fill(); g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(cx - 290, gy - eh * .8); g.lineTo(cx - 250, gy - eh); g.lineTo(cx - 210, gy - eh * .8); g.fill();
  const kd = 12.26 * km * eio(p(t, S_[3][0], S_[3][1] - .2)); g.save(); g.strokeStyle = '#ff3a5a'; g.lineWidth = 10; g.shadowColor = '#ff3a5a'; g.shadowBlur = 20; g.beginPath(); g.moveTo(cx + 300, gy); g.lineTo(cx + 300, gy + kd); g.stroke(); g.restore();
  text('KOLA 12,3 km', cx + 300, gy + kd + 50, 52, 'IDB', '#ff8aa0', { alpha: clamp(kd / 300) });
  text('Marianengraben 11 km', cx - 10, gy + md + 50, 46, 'IDX', '#9ad0ff', { alpha: clamp(md / 300) });
  if (eh > 10) text('Everest 8,8 km', cx - 250, gy - eh - 40, 50, 'IDX', '#ffffff');
  big('TIEFER ALS ALLES', 300, 100, '#ffffff', kin(3, .02)(t), { sc2: 'rgba(10,30,90,.85)' });
};
SC[4] = t => {   // Röntgen-Querschnitt durch Gesteinsschichten, Lupe enthüllt Fossilien
  const u = t - S_[4][0], fk = ph('sechs Kilometer');
  bg([[0, '#3a2a4a'], [1, '#1a1020']]);
  const cols = ['#6a5a7a', '#5a4a6a', '#7a5a5a', '#5a3a4a', '#6a4a3a', '#4a2a3a'];
  for (let i = 0; i < 12; i++) { const y = ((i * 170 - u * 90) % 2040 + 2040) % 2040 - 120; g.fillStyle = cols[i % 6]; g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= W; x += 60) g.lineTo(x, y + Math.sin(x * .01 + i) * 20); g.lineTo(W, y + 170); g.lineTo(0, y + 170); g.fill(); }

      g.save(); g.translate(fx, fy); g.rotate(i + u * .3); g.scale(a, a); g.strokeStyle = '#9af0ff'; g.lineWidth = 4; g.beginPath(); for (let k = 0; k < 40; k++) { const r = k / 40 * s, an = k * .45; g[k ? 'lineTo' : 'moveTo'](Math.cos(an) * r, Math.sin(an) * r); } g.stroke(); g.restore(); }

SC[5] = t => {   // Thermometer steigt auf 180 °C, Marke „erwartet 100 °C“
  const u = t - S_[5][0], k = eio(p(t, S_[5][0] + .1, HOT)), temp = 180 * k;
  bg([[0, `rgb(${lerp(255, 255, k)},${lerp(160, 60, k)},${lerp(60, 40, k)})`], [1, '#3a0a1a']]);
  for (let i = 0; i < 8; i++) { g.strokeStyle = `rgba(255,240,200,${.08 + .04 * (i % 2)})`; g.lineWidth = 6; g.beginPath(); for (let y = 1500; y > 300; y -= 20) g.lineTo(140 + i * 115 + Math.sin(y * .02 + u * 6 + i) * 16, y); g.stroke(); }

  text('erwartet: 100 °C', x - 240, ey - 30, 40, 'IDX', '#1a1030', { align: 'left' });
  big(Math.round(temp) + ' °C', 300, 150, '#ffffff', kin(5, .02)(t), { glow: 'rgba(255,255,255,.5)' });
  stamp('FAST ×2', 790, 760, 80, '#ffffff', p(t, HOT + .1, HOT + .4), .1);
};
SC[6] = t => {   // Schacht von innen: Gestein wird weich, Wände drücken zu, Stempel 1992
  const u = t - S_[6][0], end = ph('war Schluss'), sq = 1 - .45 * eio(p(t, S_[6][0] + .4, end)) + .05 * Math.sin(u * 5);
  bg([[0, '#000'], [1, '#000']]);
  shaftShot(t, -8 - u * (t < end ? 2 : .2), { squeeze: sq, spin: t < end ? 10 : 1, heat: .2 });
  big('WEICH WIE KNETE', 300, 96, '#ffb07a', kin(6, .05)(t));
  stamp('1992 · SCHLUSS', 540, 1420, 84, '#ff3a5a', p(t, end + .2, end + .5), -.06);
};
SC[7] = t => {   // Erde im Querschnitt: das Loch ist winzig, Eula staunt
  if (!X) setup3d();
  const u = t - S_[7][0], k = eio(p(t, S_[7][0], at(7, .55)));
  bg([[0, '#0a0a3a'], [1, '#1a0a2a']]); stars(t, .8);
  X.earth.rotation.set(0, -.5 + Math.sin(u * .5) * .08, 0);
  X.eula.pose(t, { mood: t > at(7, .5) ? 'wow' : 'think', look: [-1, .3], k: eo(p(t, at(7, .3), at(7, .6))) || 1 });
  const zoomIn = 1 - k; X.cam.position.set(lerp(1.2, -.3, zoomIn), lerp(-.6, 3.6, zoomIn), lerp(27, 7, zoomIn)); X.cam.lookAt(lerp(.9, 0, zoomIn), lerp(-.8, 4, zoomIn), 0);
  draw3d(X);
  const [sx, sy] = toScreen(X, new FX3D.THREE.Vector3(0, 4.2, 0).applyMatrix4(X.earth.matrixWorld));
  g.save(); g.fillStyle = '#ff3a5a'; g.shadowColor = '#ff3a5a'; g.shadowBlur = 20; g.beginPath(); g.arc(sx, sy, 10, 0, 7); g.fill(); g.restore();
  arrow(sx + 200, sy - 200, sx + 30, sy - 30, '#ff3a5a', 10, clamp(k * 3));
  text('12 KM', sx + 240, sy - 230, 56, 'IDB', '#ff8aa0', { alpha: clamp(k * 3) });
  big('0,2 %', 1400, 150, '#ffd23f', kin(7, .55)(t), { glow: 'rgba(255,210,60,.6)' });
  big('BIS ZUM MITTELPUNKT', 300, 80, '#ffffff', kin(7, .6)(t));
};
SC[8] = t => {   // Eula fliegt mit dem Bohrer los und taucht ins Loch: Weiterbohren!
  const u = t - S_[8][0], k = eio(p(t, S_[8][0] + .2, DIVE));
  bg(SKY); stars(t, .2);
  A || setup3d();
  A.eula.pose(t, { mood: 'fly', k: eo(p(t, S_[8][0], S_[8][0] + .3)) });
  A.eula.position.set(lerp(-2, 0, k), lerp(1.8, 5, Math.sin(k * Math.PI) * .6) + lerp(0, -2.5, k * k), lerp(.6, 0, k)); A.eula.rotation.x = k * .45;
  A.drill.visible = t < DIVE + .1; A.drill.position.set(A.eula.position.x, A.eula.position.y - 2.4, A.eula.position.z); A.drill.rotation.y = t * 20; A.drill.userData.mesh.material.emissiveIntensity = .3 * k;
  snowShot([Math.sin(u * .6) * 3, 3.6, 15 - u * .8], [-.5, 2 - k * .6, 0], { t, glow: k });
  A.eula.position.set(-2, 1.8, .6); A.eula.rotation.x = 0;
  if (t > DIVE) { const f = 1 - p(t, DIVE, DIVE + .35); g.fillStyle = `rgba(255,220,180,${f})`; g.fillRect(0, 0, W, H); burst(t, DIVE, 540, 1000, { scale: 1, col: [255, 160, 60] }); }
  big('WIR BOHREN WEITER!', 300, 96, '#ffffff', kin(8, .1)(t), { sc2: 'rgba(20,30,90,.85)' });
};
SC[9] = t => {   // Fahrt durch den Schacht nach unten: Erdmantel, Bohrer glüht
  const u = t - S_[9][0], k = eio(p(t, S_[9][0], S_[10][0])), stb = ph('Stahlbohrer'), tk = ph('über tausend');
  bg([[0, '#000'], [1, '#000']]);
  shaftShot(t, lerp(-25, -112, k), { spin: 26, heat: lerp(.1, 1.4, p(t, stb, stb + 1)) });
  g.save(); g.globalCompositeOperation = 'lighter'; glow(540, 1150, 380, [255, 120, 30], .5 * p(t, stb, stb + 1)); g.restore();
  big(fmt(lerp(12, 100, k)) + ' KM', 280, 130, '#ffffff', kin(9, .02)(t), { glow: 'rgba(255,150,60,.5)' });
  big('ÜBER 1000 °C', 430, 90, '#ffd23f', p(t, tk, tk + .35));
  big('BOHRER GLÜHT', 1430, 96, '#ff7a3a', p(t, stb + .3, stb + .65), { glow: 'rgba(255,120,40,.7)' });
};
SC[10] = t => {   // Split-Screen: Erdkern (3D) gegen Sonnenoberfläche
  if (!X) setup3d();
  const u = t - S_[10][0], so = ph('Sonne'), temp = 5000 * eio(p(t, S_[10][0] + .1, so));
  splitScreen(p(t, so - .3, so + .2), () => {
    bg([[0, '#3a0a0a'], [1, '#100008']]);
    X.earth.rotation.set(0, -.3 + u * .05, 0); X.eula.visible = false; X.cam.position.set(Math.sin(u * .7) * .8, 0, 14 - u * .3); X.cam.lookAt(0, 0, 0); draw3d(X); X.eula.visible = true; text('ERDKERN', 300, 960, 66, 'IDB', '#ffffff', { stroke: 8, strokeColor: 'rgba(90,20,0,.85)' });
  }, () => {
    bg([[0, '#ffb020'], [1, '#ff5a10']]);
    for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283 + u * .5, r = 360 + Math.sin(u * 3 + i) * 40; g.fillStyle = 'rgba(255,240,150,.5)'; g.beginPath(); g.arc(800 + Math.cos(a) * r, 960 + Math.sin(a) * r, 40, 0, 7); g.fill(); }
    g.fillStyle = '#fff0a0'; g.beginPath(); g.arc(800, 960, 320, 0, 7); g.fill(); text('SONNE', 820, 960, 70, 'IDB', '#ff6a10');
  }, { line: '#ffd23f' });
  big(fmt(temp) + ' °C', 300, 140, '#ffffff', kin(10, .02)(t), { glow: 'rgba(255,200,80,.6)' });
  big('SO HEISS WIE DIE SONNE', 1430, 76, '#ffd23f', p(t, so + .2, so + .55));
};
SC[11] = t => {   // Zeitraffer: Tag und Nacht rasen vorbei, Jahre zählen bis 10.000
  const u = t - S_[11][0], k = eio(p(t, S_[11][0] + .1, S_[11][1] - .2)), day = (Math.sin(u * 9) + 1) / 2;
  bg([[0, `rgb(${lerp(10, 90, day)},${lerp(10, 150, day)},${lerp(40, 255, day)})`], [1, '#2a1a10']]); stars(t, 1 - day);
  const sa = u * 9; g.fillStyle = day > .5 ? '#ffe070' : '#e8e8ff'; g.beginPath(); g.arc(540 + Math.cos(sa) * 420, 900 - Math.abs(Math.sin(sa)) * 360, 60, 0, 7); g.fill();
  g.fillStyle = '#3a2a1a'; g.fillRect(0, 1150, W, 400); g.strokeStyle = '#ff3a5a'; g.lineWidth = 10; g.beginPath(); g.moveTo(540, 1150); g.lineTo(540, 1150 + 280 * k); g.stroke();
  for (let i = 0; i < 6; i++) { const f = (u * 3 + i / 6) % 1; text(String(Math.round(lerp(2000, 12000, k)) - i * 3), 160 + i * 150, 620 - f * 200, 40, 'IDX', `rgba(255,255,255,${(1 - f) * .6})`); }
  big(fmt(Math.round(10000 * k / 10) * 10) + ' JAHRE', 300, 130, '#ffffff', kin(11, .02)(t), { glow: 'rgba(255,255,255,.4)' });
  big('IM KOLA-TEMPO', 1430, 84, '#ffd23f', kin(11, .3)(t));
};
SC[12] = t => {   // Pointe und Schleife: zurück zu Eula am Loch, Kamera fährt zur Startposition
  const u = t - S_[12][0], fr = ph('einzigen Frage'), k = eio(p(t, S_[12][0], TIMING.dur));   // Kamera fährt bis zum letzten Bild
  bg(SKY); stars(t, .2);
  A || setup3d();
  A.eula.pose(t, { mood: t < fr ? 'point' : t < END - .5 ? 'happy' : 'idle', dir: 1, look: [.6, -.6], k: t < END - .5 ? eo(p(t, S_[12][0], S_[12][0] + .3)) : 1 - eo(p(t, END - .5, END - .1)) });
  snowShot(camLerp(C1, C0, k), camLerp(L1, L0, k), { t, glow: .3 * (1 - k) });
  big('NUR EIN WEG: NACH UNTEN', 300, 72, '#ffffff', kin(12, .05)(t), { alpha: 1 - p(t, fr + .6, fr + 1), sc2: 'rgba(20,30,90,.85)' });
  big('…', 1430, 140, '#ffd23f', p(t, fr + .2, fr + .5), { alpha: 1 - p(t, END - .4, END) });
};
function scene(t) {
  let i = 0; while (i < NS - 1 && t >= S_[i + 1][0]) i++;
  SC[Math.min(i, SC.length - 1)](t);
}
