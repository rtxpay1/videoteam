<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IDB; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf); }
@font-face { font-family: IDX; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IDS; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf); }
@font-face { font-family: IDM; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf); }

<body><canvas id="c" width="1080" height="1920"></canvas>
<!-- Maskottchen Eula: alle Posen aus engine/fx3d.js -->
<script>
window.READY3D = new Promise(r => window.__ready3d = r);
window.CFG = { DUR: 10.5, CUTS: [], PHRASES: [[9, 9.5, ' ']], CAP_END: 0 };
</script>
<script src="../engine/lib.js"></script>
<script src="../engine/fx.js"></script>
<script type="module" src="../engine/fx3d.js"></script>
<script>
// Alle Posen von Eula aus dem 3D-Baukasten (FX3D.eula), je 1,5 Sekunden
let ST = null, EU = null;
const MOODS = [['idle', 'schwebt'], ['wave', 'winkt'], ['wow', 'staunt'], ['point', 'zeigt'], ['think', 'denkt nach'], ['happy', 'freut sich'], ['fly', 'fliegt']];
const BGS = [[[0, '#2ad0a0'], [.6, '#1a7aff'], [1, '#3a1a7a']], [[0, '#ff9a3a'], [.6, '#ff4f7a'], [1, '#5a1a8a']], [[0, '#1a3aff'], [.6, '#5a1aaa'], [1, '#ff4fb0']]];
function scene(t) {
  if (!ST) { ST = FX3D.stage({ dist: 15, fov: 30 }); EU = ST.add(FX3D.eula()); ST.ring = ST.add(FX3D.ring(2.6, .06, 0x7af0ff)); }
  const i = Math.min(MOODS.length - 1, Math.floor(t / 1.5)), u = t - i * 1.5;
  bg(BGS[i % 3]); stars(t, .5); aurora(t, .4);
  EU.pose(t, { mood: MOODS[i][0], k: eo(p(u, 0, .3)) });
  EU.rotation.y = Math.sin(t * .6) * .25; EU.position.y = -.9;
  ST.ring.position.set(0, -2.6, 0); ST.ring.rotation.set(1.45, 0, t);
  ST.cam.position.set(Math.sin(t * .5) * 2, .8, 15); ST.cam.lookAt(0, -.2, 0);
  g.drawImage(FX3D.render(ST), 0, 0, W, H);
  text('EULA', 540, 300, 120, 'IDB', '#ffffff', { stroke: 10, strokeColor: 'rgba(10,6,30,.85)' });
  text(MOODS[i][1], 540, 420, 64, 'IDX', '#ffd23f', { stroke: 8, strokeColor: 'rgba(10,6,30,.85)' });
}
</script>
</body></html>
