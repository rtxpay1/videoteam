<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IDB; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf); }
@font-face { font-family: IDX; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IDS; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf); }
@font-face { font-family: IDM; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf); }
html, body { margin: 0; background: #000; } canvas { display: block; }

<body><canvas id="c" width="1080" height="1920"></canvas>
<!-- Maskottchen Eula: winkt, staunt, dreht sich (je 2 Sekunden) -->
<script>
window.READY3D = new Promise(r => window.__ready3d = r);
window.CFG = { DUR: 6, CUTS: [], PHRASES: [[9, 9.5, ' ']], CAP_END: 0 };
</script>
<script src="../engine/lib.js"></script>
<script src="../engine/fx.js"></script>
<script type="module" src="../engine/fx3d.js"></script>
<script>
let FIG = null;
// Gesicht: zwei Augen mit Glanzpunkt und ein Mund, der zwischen Lächeln und offenem Staunen wechselt
function face(F, o) {
  const T = F.THREE, grp = new T.Group(), black = new T.MeshBasicMaterial({ color: 0x140a24 }), white = new T.MeshBasicMaterial({ color: 0xffffff });
  const eyes = [-1, 1].map(s => {
    const e = new T.Group();
    const w = new T.Mesh(new T.SphereGeometry(o.eye, 12, 8), white); w.scale.set(1, 1.25, .45); e.add(w);
    const pu = new T.Mesh(new T.SphereGeometry(o.eye * .55, 10, 6), black); pu.scale.set(1, 1.2, .5); pu.position.set(0, -o.eye * .12, o.eye * .3); e.add(pu);
    const hl = new T.Mesh(new T.SphereGeometry(o.eye * .18, 6, 4), white); hl.position.set(o.eye * .2, o.eye * .25, o.eye * .55); e.add(hl);
    e.position.set(s * o.gap, o.ey, o.z); grp.add(e); return e;
  });
  const smile = new T.Mesh(new T.TorusGeometry(o.mouth, o.mouth * .22, 6, 12, Math.PI), black); smile.rotation.z = Math.PI; smile.position.set(0, o.my, o.z); grp.add(smile);
  const open = new T.Mesh(new T.SphereGeometry(o.mouth * .8, 10, 8), new T.MeshBasicMaterial({ color: 0x5a0a20 })); open.scale.set(.9, 1.2, .3); open.position.set(0, o.my - o.mouth * .3, o.z); grp.add(open);
  const cheeks = [-1, 1].map(s => { const c = new T.Mesh(new T.CircleGeometry(o.eye * .55, 10), new T.MeshBasicMaterial({ color: 0xff7aa0, transparent: true, opacity: .7 })); c.position.set(s * o.gap * 1.45, o.my + o.mouth * .2, o.z - .02); grp.add(c); return c; });
  grp.userData = { eyes, smile, open, cheeks };
  return grp;
}
function setMood(f, wow) { const u = f.userData; u.smile.visible = !wow; u.open.visible = wow; u.eyes.forEach(e => e.scale.setScalar(wow ? 1.25 : 1)); }
// Gummiarm mit weißem Handschuh
function arm(F, len, col) {
  const T = F.THREE, grp = new T.Group();
  const a = F.solid(new T.CapsuleGeometry(.11, len, 2, 6), F.toon(col), .12); a.position.y = -len / 2; grp.add(a);
  const h = F.solid(new T.IcosahedronGeometry(.26, 1), F.toon(0xffffff), .08); h.position.y = -len - .15; grp.add(h);
  return grp;
}
function leg(F, len, col) {
  const T = F.THREE, grp = new T.Group();
  const l = F.solid(new T.CapsuleGeometry(.12, len, 2, 6), F.toon(col), .12); l.position.y = -len / 2; grp.add(l);
  const s = F.solid(new T.BoxGeometry(.45, .22, .6), F.toon(0xff4f7a), .08); s.position.set(0, -len - .1, .12); grp.add(s);
  return grp;
}

// Eula, die Wissens-Eule: rund und weich (keine Facetten), mit roter Cappie und goldenem Token vorne drauf
function soft(F, col, o) { const m = F.toon(col, o); m.flatShading = false; return m; }
function owl(F) {
  const T = F.THREE, grp = new T.Group(), S = (r, w = 28, h = 20) => new T.SphereGeometry(r, w, h);
  // Körper mit eingefärbtem ovalem Bauch (Farbe pro Ecke, dadurch weicher Rand statt aufgeklebter Fläche)
  const BS = new T.Vector3(1, 1.12, .9), onBody = (ph, th, r = 1.5) => new T.Vector3(-r * Math.cos(ph) * Math.sin(th), r * Math.cos(th), r * Math.sin(ph) * Math.sin(th)).multiply(BS);
  const bgeo = S(1.5, 72, 54), bp = bgeo.attributes.position, bc = new Float32Array(bp.count * 3), cO = new T.Color(0xffa83a), cB = new T.Color(0xffe6b8), cc = new T.Color();
  for (let i = 0; i < bp.count; i++) {
    const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i), d = Math.hypot(x / .95, (y + .62) / .82);
    cc.copy(cO).lerp(cB, z > 0 ? clamp((1.08 - d) / .1) : 0); bc.set([cc.r, cc.g, cc.b], i * 3);
  }
  bgeo.setAttribute('color', new T.BufferAttribute(bc, 3));
  const body = F.solid(bgeo, soft(F, 0xffffff, { vertexColors: true }), .035); body.scale.copy(BS); grp.add(body);
  [[1.98, [-.3, 0, .3]], [2.22, [-.45, -.15, .15, .45]], [2.45, [-.3, 0, .3]]].forEach(([th, phs]) => phs.forEach(d => {
    const pos = onBody(Math.PI / 2 + d, th, 1.53), fe = new T.Mesh(new T.TorusGeometry(.12, .028, 4, 10, Math.PI), new T.MeshBasicMaterial({ color: 0xe8a860 }));
    fe.position.copy(pos); fe.lookAt(pos.clone().divide(BS).divide(BS).multiplyScalar(3)); fe.rotateZ(Math.PI); grp.add(fe);
  }));
  [-1, 1].forEach(s => { const m = F.solid(S(.58), soft(F, 0xffe9c4), 0); m.scale.set(1, 1, .35); m.position.set(s * .55, .52, 1.02); grp.add(m); });
  const f = face(F, { eye: .38, gap: .55, ey: .55, my: -.06, mouth: .13, z: 1.18 }); grp.add(f); grp.userData.face = f;
  const beak = F.solid(new T.ConeGeometry(.17, .38, 12), soft(F, 0xff6a2a), .06); beak.rotation.x = Math.PI / 2 + .35; beak.position.set(0, .2, 1.33); grp.add(beak);
  // Federohren: je zwei spitze Federbüschel, die schräg über der Cappie herausstehen
  [-1, 1].forEach(s => {
    const ear = new T.Group();
    [[0, .95, .3, 0xe8862a], [s * .28, .65, .22, 0xffa83a]].forEach(([x, h, r, c], k) => { const fe = F.solid(new T.ConeGeometry(r, h, 14), soft(F, c), .07); fe.position.set(x, h / 2, k * .05); fe.rotation.z = -s * k * .35; ear.add(fe); });
    ear.position.set(s * .95, 1.35, .1); ear.rotation.set(-.1, 0, -s * .62); grp.add(ear);
  });
  // rote Cappie: Kuppel, Schirm nach vorn, Knopf oben, goldener Token als Logo
  const cap = new T.Group(), red = soft(F, 0xe8263a);
  const crown = F.solid(new T.SphereGeometry(1.05, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), red, .04); crown.scale.set(1, .78, 1); cap.add(crown);
  const brim = F.solid(new T.CylinderGeometry(.85, .85, .07, 28), soft(F, 0xc81a2e), .06); brim.scale.set(1, 1, .8); brim.position.set(0, .02, .78); cap.add(brim);
  const knob = F.solid(S(.11, 12, 8), red, .1); knob.position.y = .82; cap.add(knob);
  const logo = F.solid(new T.CylinderGeometry(.24, .24, .06, 20), soft(F, 0xffc93a, { emissive: 0xffa000, ei: .25 }), .1); logo.rotation.x = Math.PI / 2 - .25; logo.position.set(0, .28, .98); cap.add(logo);
  cap.position.set(0, 1.18, 0); cap.rotation.set(-.08, 0, -.1); grp.add(cap);
  const wl = F.solid(S(.7, 20, 14), soft(F, 0xe8862a), .05), wr = F.solid(S(.7, 20, 14), soft(F, 0xe8862a), .05);
  [wl, wr].forEach(w => { w.scale.set(.35, 1, .6); w.position.y = -.6; });
  const al = new T.Group(), ar = new T.Group(); al.add(wl); ar.add(wr); al.position.set(-1.38, .1, 0); ar.position.set(1.38, .1, 0); grp.add(al, ar);
  [-1, 1].forEach(s => { const ft = F.solid(S(.26, 16, 10), soft(F, 0xff6a2a), .08); ft.scale.set(1.1, .45, 1.3); ft.position.set(s * .5, -1.68, .35); grp.add(ft); });
  grp.userData.arms = [al, ar];
  return grp;
}
function setup() {
  const F = window.FX3D;
  FIG = [owl, owl, owl].map(fn => { const st = F.stage({ dist: 15, fov: 30 }); st.fig = st.add(fn(F)); st.ring = st.add(F.ring(2.6, .06, 0x7af0ff)); return st; });
}
const NAMES = [['EULA', 'winkt'], ['EULA', 'staunt'], ['EULA', 'von der Seite']];
const BGS = [[[0, '#2ad0a0'], [.6, '#1a7aff'], [1, '#3a1a7a']], [[0, '#ff9a3a'], [.6, '#ff4f7a'], [1, '#5a1a8a']], [[0, '#1a3aff'], [.6, '#5a1aaa'], [1, '#ff4fb0']]];
function scene(t) {
  if (!FIG) setup();
  const i = Math.min(2, Math.floor(t / 2)), wow = i === 1, st = FIG[i], f = st.fig, d = f.userData;
  bg(BGS[i]); stars(t, .5); aurora(t, .4);
  setMood(d.face, wow);
  f.rotation.set(0, i === 2 ? -1.1 + (t - 4) * .9 : wow ? Math.sin(t * 3) * .1 : -.4 + Math.sin(t * 2) * .1, wow ? Math.sin(t * 9) * .04 : 0);
  f.position.set(0, -.6 + Math.abs(Math.sin(t * 4)) * (wow ? .5 : .15), 0);
  const [al, ar] = d.arms;
  if (wow) { al.rotation.z = -2.6 + Math.sin(t * 12) * .15; ar.rotation.z = 2.6 - Math.sin(t * 12) * .15; }
  else { al.rotation.z = -.25; ar.rotation.z = 2.4 + Math.sin(t * 8) * .5; }
  st.ring.position.set(0, -2.6, 0); st.ring.rotation.set(1.45, 0, t);
  st.cam.position.set(Math.sin(t * .5) * 2, .8, 15); st.cam.lookAt(0, -.2, 0);
  g.drawImage(FX3D.render(st), 0, 0, W, H);
  text(NAMES[i][0], 540, 300, 120, 'IDB', '#ffffff', { stroke: 10, strokeColor: 'rgba(10,6,30,.85)' });
  text(NAMES[i][1], 540, 420, 64, 'IDX', '#ffd23f', { stroke: 8, strokeColor: 'rgba(10,6,30,.85)' });
  
}
</script>
</body></html>
