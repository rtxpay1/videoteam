<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IDB; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf); }
@font-face { font-family: IDX; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IDS; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf); }
@font-face { font-family: IDM; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<!-- Test „Regenstraße“ (10 s): Auto fährt bei Regen über nasse Straße, Räder drehen, Bäume und Laternen ziehen vorbei,
     Kamera fährt seitlich mit und schwenkt dann tief vor das Rad. Eula sitzt am Steuer. -->
<script>
window.LICHT3D = ['city'];
window.READY3D = new Promise(r => window.__ready3d = r);
const TIMING = { dur: 10, bpm: 96, sentences: [[0, 5], [5, 10]], phrases: [[0, 10, ' ']] };
window.CFG = { DUR: 10, CUTS: [5], PHRASES: TIMING.phrases, CAP_END: 0, KEY: /^$/, LOOP: true, UEBERGANG: ['wisch'] };
</script>
<script type="module" src="../engine/fx3d.js"></script>
<script src="../engine/lib.js"></script>
<script src="../engine/fx.js"></script>
<script>
let S; const draw3d = st => g.drawImage(FX3D.render(st), 0, 0, W, H);
const V = 14;   // Fahrtempo in Einheiten pro Sekunde
function setup() {
  const F = FX3D, T = F.THREE, r = F.rng(9);
  S = F.licht(F.stage({ fov: 36 }), 'city', { staerke: 1 }); F.himmel(S, { sonne: [3, 200], dunst: 10, rayleigh: 3 }); F.nebel(S, 0x5a6878, 18, 110);
  S.strasse = S.add(F.rund(12, .2, 400, .1, F.glanz(0x23262c, { rau: .35, lack: .4 }))); S.strasse.position.y = -.1;
  S.film = S.add(F.wasser(12, 400, { farbe: 0x2a3a4a, tiefe: .55, spiegel: .6 })); S.film.position.y = .02;
  S.gras = S.add(F.boden(220, { farbe: 0x2c4a2e, rand: 0x46535e })); S.gras.position.y = -.2;
  // bewegliche Teile: Mittelstreifen, Bäume, Laternen (laufen in einer Schleife durch)
  S.weg = new T.Group(); S.add(S.weg);
  for (let k = 0; k < 40; k++) { const m = F.rund(.25, .04, 3, .02, F.glanz(0xf2f2e8, { rau: .4 })); m.position.set(0, .06, -k * 8); S.weg.add(m); }
  for (let k = 0; k < 60; k++) { const s = k % 2 ? 1 : -1, tr = new T.Group(); tr.position.set(s * (9 + r() * 7), 0, -k * 5.5 - r() * 3);
    const st = new T.Mesh(new T.CylinderGeometry(.18, .26, 2.2, 8), F.glanz(0x4a3426, { rau: .9, lack: 0 })); st.position.y = 1.1; tr.add(st);
    [[3.2, 1.9], [4.4, 1.5], [5.4, 1.0]].forEach(([y, rr]) => { const c = new T.Mesh(new T.ConeGeometry(rr, 1.8, 9), F.glanz(0x1f4a2a, { rau: .8, lack: 0 })); c.position.y = y; tr.add(c); });
    S.weg.add(tr); }
  for (let k = 0; k < 12; k++) { const s = k % 2 ? 1 : -1, l = new T.Group(); l.position.set(s * 7.2, 0, -k * 30);
    const p = F.rund(.16, 6, .16, .06, F.glanz(0x6a707a, { metall: .8, rau: .3 })); p.position.y = 3; l.add(p);
    const arm = F.rund(1.6, .12, .12, .05, F.glanz(0x6a707a, { metall: .8, rau: .3 })); arm.position.set(-s * .7, 6, 0); l.add(arm);
    const lamp = F.rund(.5, .14, .3, .06, new T.MeshStandardMaterial({ color: 0xfff0c8, emissive: 0xffd890, emissiveIntensity: 1.6 })); lamp.position.set(-s * 1.4, 5.9, 0); l.add(lamp);
    S.weg.add(l); }
  S.auto = S.add(F.auto({ farbe: 0x2a6ae8, licht: 1.4 })); S.auto.rotation.y = Math.PI / 2; S.auto.position.set(-2, 0, 0);
  S.eu = F.eula(); S.eu.scale.setScalar(.36); S.eu.rotation.y = -.4; S.auto.innen.add(S.eu);
}
// Regen: schräge Streifen in zwei Tiefen, darüber Tropfen auf der Linse
const RAIN = (() => { const r = rng(21); return Array.from({ length: 260 }, () => ({ x: r() * 1300 - 100, y: r() * H, l: 30 + r() * 70, v: 1800 + r() * 1400, a: .12 + r() * .25 })); })();
function regen(t) {
  g.save(); g.lineCap = 'round';
  RAIN.forEach(d => { const y = (d.y + t * d.v) % (H + 200) - 100, x = d.x - (y / H) * 160; g.strokeStyle = `rgba(200,220,240,${d.a})`; g.lineWidth = d.l > 70 ? 3 : 1.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x - d.l * .18, y + d.l); g.stroke(); });
  g.restore();
}
function welt(t) {
  const z = (t * V) % 8, zz = t * V;
  S.weg.children.forEach((o, i) => { if (o.userData.z0 == null) o.userData.z0 = o.position.z; const per = i < 40 ? 320 : 330, w = o.userData.z0 + zz; o.position.z = (((w - 20) % per) + per) % per - per + 20; });
  S.auto.raeder.forEach(w => w.rotation.z = -t * V / .45);
  S.auto.position.y = Math.sin(t * 9) * .02; S.film.welle(t * 2, .25);
}
const SC = [];
SC[0] = t => {
  bg([[0, '#3a4656'], [1, '#1a2028']]); welt(t);
  S.eu.pose(t, { mood: 'wow', ziel: [-2, 1.4, -12] });
  FX3D.kamera(S, t, [{ t: 0, pos: [9, 2.2, 4], ziel: [-2, 1, -1], fov: 40 }, { t: 5, pos: [5, 1.4, 1.5], ziel: [-2, 1.3, 0], fov: 32 }]);
  draw3d(S); regen(t);
};
SC[1] = t => {
  bg([[0, '#3a4656'], [1, '#1a2028']]); welt(t);
  S.eu.pose(t, { mood: 'think', ziel: [0, 0, 6] });
  FX3D.kamera(S, t - 5, [{ t: 0, pos: [1.5, .45, 5.5], ziel: [-1, .5, 1.4], fov: 38 }, { t: 5, pos: [-1, .6, 7], ziel: [-2, .7, 0], fov: 30 }]);
  draw3d(S); regen(t);
};
SC.forEach((f, i) => { SC[i] = t => { if (!S) setup(); f(t); }; });
function scene(t) { SC[t < 5 ? 0 : 1](t); }
</script>
</body></html>
