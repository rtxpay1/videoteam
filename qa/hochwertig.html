<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IDB; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf); }
@font-face { font-family: IDX; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IDS; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf); }
@font-face { font-family: IDM; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<!-- Vorschau „hochwertig“ (10 s): echtes Set statt Kisten. Szene 1: Auto treibt auf dem See im Abendlicht, Kamerafahrt um das Auto,
     Eula hinter der getönten Scheibe. Szene 2: unter Wasser, das Auto sinkt, Blasen steigen, Nebel gibt Tiefe, Licht fällt von oben. -->
<script>
window.LICHT3D = ['sunset'];
window.READY3D = new Promise(r => window.__ready3d = r);
const TIMING = { dur: 10, bpm: 96, sentences: [[0, 5], [5, 10]], phrases: [[0, 10, ' ']] };
window.CFG = { DUR: 10, CUTS: [5], PHRASES: TIMING.phrases, CAP_END: 0, KEY: /^$/, LOOP: true, UEBERGANG: [{ art: 'zoom', x: 540, y: 1000 }] };
</script>
<script type="module" src="../engine/fx3d.js"></script>
<script src="../engine/lib.js"></script>
<script src="../engine/fx.js"></script>
<script>
let A, B;
const draw3d = st => g.drawImage(FX3D.render(st), 0, 0, W, H);
function setup() {
  const F = FX3D, T = F.THREE;
  // A: See im Abendlicht
  A = F.licht(F.stage({ fov: 34 }), 'sunset', { staerke: 1.1 }); F.himmel(A, { sonne: [6, 250], dunst: 6 }); F.nebel(A, 0x8a7a98, 40, 170);
  A.see = A.add(F.wasser(140, 140, { farbe: 0x123e5c, tiefe: .95, spiegel: .3 }));
  A.auto = A.add(F.auto({ farbe: 0xd8283c })); A.auto.position.set(0, -.95, 0);
  A.eu = F.eula(); A.eu.scale.setScalar(.36); A.eu.rotation.y = .5; A.auto.innen.add(A.eu);
  // Hügelkette und Bäume am Ufer (viele kleine Teile statt einer großen Form)
  const rr = F.rng(4);
  for (let k = 0; k < 9; k++) { const h = A.add(F.rock(1, { color: [0x40603a, 0x355a34, 0x4a6a40][k % 3], rough: .25, seed: k + 2, outline: 0 })); h.scale.set(14 + rr() * 10, 5 + rr() * 6, 8); h.position.set(-90 + k * 22, 0, -70 - rr() * 30); }
  for (let k = 0; k < 40; k++) { const tr = A.add(new T.Mesh(new T.ConeGeometry(1, 3.4, 7), F.glanz(0x24482c, { rau: .9, lack: 0 }))); tr.position.set(-60 + k * 3 + rr() * 2, 1.4, -42 - rr() * 8); tr.scale.setScalar(.8 + rr() * .7); }
  // B: unter Wasser
  B = F.licht(F.stage({ fov: 40 }), 'sunset', { staerke: .7 }); F.nebel(B, 0x0b3a5a, 6, 34);
  B.auto = B.add(F.auto({ farbe: 0xd8283c, licht: 1.2 })); B.eu = F.eula(); B.eu.scale.setScalar(.36); B.eu.rotation.y = .5; B.auto.innen.add(B.eu);
  B.oben = B.add(F.wasser(80, 80, { farbe: 0x6ac8f0, tiefe: .55 })); B.oben.position.y = 7;
  B.bl = B.add(F.blasen(90, [7, 14, 5])); B.grund = B.add(F.boden(40, { farbe: 0x5a6a4a, rand: 0x0b3a5a })); B.grund.position.y = -8;
  for (let k = 0; k < 14; k++) { const s = B.add(F.rund(.25, 2 + (k % 4), .25, .1, F.glanz(0x2f7a4a, { rau: .8, lack: 0 }))); s.position.set(-9 + k * 1.4, -7, -4 - (k % 3) * 3); s.rotation.z = Math.sin(k) * .3; }
}
const SC = [];
SC[0] = t => {
  bg([[0, '#2a1a40'], [1, '#e89a70']]);
  A.see.welle(t, 1.2);
  const r = A.auto; r.rotation.set(Math.sin(t * 1.4) * .05, .35, .04 + Math.sin(t * 1.1) * .04); r.position.y = -.95 - t * .06;
  A.eu.pose(t, { mood: 'wow', ziel: [6, 2, 6] });
  FX3D.kamera(A, t, [{ t: 0, pos: [11, 3.2, 12], ziel: [0, 1, 0], fov: 38 }, { t: 5, pos: [3.5, 2, 7.5], ziel: [-.2, 1.4, 0], fov: 30 }]);
  draw3d(A);
};
SC[1] = t => {
  const u = t - 5;
  bg([[0, '#1a6a9a'], [1, '#04121e']]);
  g.save(); g.globalCompositeOperation = 'lighter';   // Lichtstrahlen von oben
  for (let k = 0; k < 6; k++) { const x = 120 + k * 170 + Math.sin(t * .6 + k) * 40; g.fillStyle = `rgba(160,220,255,${.05 + .03 * Math.sin(t + k)})`; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 70, 0); g.lineTo(x + 260, H); g.lineTo(x + 120, H); g.fill(); }
  g.restore();
  B.oben.welle(t, .8); B.bl.steigen(t);
  const r = B.auto; r.position.y = 1.5 - u * .7; r.rotation.set(.12, .5, -.25 - u * .03);
  B.eu.pose(t, { mood: 'think', ziel: [0, 7, 3] });
  FX3D.kamera(B, u, [{ t: 0, pos: [6, -1, 9], ziel: [0, 0, 0], fov: 42 }, { t: 5, pos: [3, -3.5, 6.5], ziel: [0, -1.5, 0], fov: 34 }]);
  draw3d(B);
};
SC.forEach((f, i) => { SC[i] = t => { if (!A) setup(); f(t); }; });
function scene(t) { SC[t < 5 ? 0 : 1](t); }
</script>
</body></html>
