<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IDB; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf); }
@font-face { font-family: IDX; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IDS; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf); }
@font-face { font-family: IDM; src: url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const TIMING = __TIMING__;
const T = { b: TIMING.sentences[1][0], c: TIMING.sentences[2][0], d: TIMING.sentences[3][0], e: TIMING.sentences[4][0], end: TIMING.sentences[4][1] + .25 };
window.CFG = {
  REPL: [['siebenundzwanzig', '27']],
  DUR: TIMING.dur, CUTS: [T.b, T.c, T.d, T.e], PHRASES: TIMING.phrases, CAP_END: T.end,
  KEY: /^(Mond|Seite|eigentlich|dreht|einmal|Umlauf|Schwerkraft|Länge|Beule|abgebremst|siebenundzwanzig|Tage|Rückseite|dunkel|Sonne)/,
  split: t => 26 * Math.max(0, 1 - Math.abs(t - .72) / .3) + 10 * (1 - p(t, .0, .5)),
  shake: t => 14 * Math.max(0, 1 - (t - .72) / .35) * (t > .72 ? 1 : 0),
};
const ph = i => TIMING.phrases[i][0];
</script>
<script src="../engine/lib.js"></script>
<script>
// ---------- Mond (prozedural, mit Drehung) ----------
const CR = (() => { const r = rng(11); return Array.from({ length: 46 }, () => ({ lon: r() * 6.283, lat: (r() - .5) * 2.6, s: .05 + Math.pow(r(), 3) * .2 })); })();
const MARE = (() => { const r = rng(23); return Array.from({ length: 9 }, () => ({ lon: (r() - .5) * 2.2, lat: (r() - .5) * 1.4, s: .18 + r() * .22 })); })();
// rot = Drehwinkel des Mondes; light = Winkel, aus dem die Sonne scheint (Bildschirm); flag = Markierung unserer Seite
function moon(x, y, r, rot, o = {}) {
  const sx = o.sx || 1, sy = o.sy || 1, dir = o.dir || 0;
  g.save(); g.translate(x, y); g.rotate(dir); g.scale(sx, sy);
  if (o.glow !== false) { g.save(); g.globalCompositeOperation = 'lighter'; glow(0, 0, r * 1.6, o.glowCol || [150, 170, 255], .25); g.restore(); }
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.save(); g.clip();
  const base = g.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); base.addColorStop(0, '#e9e6f2'); base.addColorStop(1, '#a6a3bd');
  g.fillStyle = base; g.fillRect(-r, -r, r * 2, r * 2);
  const proj = (lon, lat) => { const l = lon + rot; return [Math.sin(l) * Math.cos(lat) * r, -Math.sin(lat) * r, Math.cos(l) * Math.cos(lat)]; };
  MARE.forEach(m => { const [px, py, z] = proj(m.lon, m.lat); if (z <= 0) return; g.fillStyle = `rgba(90,88,120,${.35 * z})`; g.beginPath(); g.ellipse(px, py, m.s * r * z, m.s * r * .8, 0, 0, 7); g.fill(); });
  CR.forEach(c => { const [px, py, z] = proj(c.lon, c.lat); if (z <= .05) return; const rr = c.s * r * .5; g.fillStyle = `rgba(110,106,140,${.5 * z})`; g.beginPath(); g.ellipse(px, py, rr * z, rr, 0, 0, 7); g.fill(); g.strokeStyle = `rgba(255,255,255,${.35 * z})`; g.lineWidth = Math.max(1, rr * .18); g.beginPath(); g.ellipse(px - rr * .1, py - rr * .1, rr * z, rr, 0, Math.PI * .9, Math.PI * 1.8); g.stroke(); });
  if (o.flag !== false) {
    const [px, py, z] = proj(0, .15);
    if (z > 0) { g.save(); g.translate(px, py); g.scale(Math.max(z, .25), 1); g.strokeStyle = '#2a2440'; g.lineWidth = r * .03; g.beginPath(); g.moveTo(0, r * .2); g.lineTo(0, -r * .2); g.stroke(); g.fillStyle = '#ffcf3a'; g.fillRect(0, -r * .2, r * .2, r * .12); g.restore(); }
  }
  if (o.light != null) {
    // Schattenseite: weiche Halbkugel gegenüber dem Licht
    const lx = Math.cos(o.light), ly = Math.sin(o.light), sh = g.createLinearGradient(lx * r, ly * r, -lx * r, -ly * r);
    sh.addColorStop(0, 'rgba(8,6,25,0)'); sh.addColorStop(.48, 'rgba(8,6,25,0)'); sh.addColorStop(.6, 'rgba(8,6,25,.82)'); sh.addColorStop(1, 'rgba(8,6,25,.9)');
    g.fillStyle = sh; g.fillRect(-r, -r, r * 2, r * 2);
  }
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke();
  g.restore();
}
function earth(x, y, r, a = 1) {
  g.save(); g.globalAlpha *= a; g.save(); g.globalCompositeOperation = 'lighter'; glow(x, y, r * 1.8, [60, 160, 255], .35); g.restore();
  const gr = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gr.addColorStop(0, '#7fd4ff'); gr.addColorStop(.6, '#1f6fd6'); gr.addColorStop(1, '#0c2f7a');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.fillStyle = 'rgba(80,200,120,.85)'; [[-.35, -.2, .32, .22], [.25, .1, .26, .34], [-.1, .45, .2, .14]].forEach(([dx, dy, w, h]) => { g.beginPath(); g.ellipse(x + dx * r, y + dy * r, w * r, h * r, .4, 0, 7); g.fill(); });
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.restore();
}
function label(s, x, y, col, k, size = 40) { if (k > 0) text(s, x, y, size, 'IDX', col, { alpha: eo(k), sc: lerp(1.3, 1, eback(k)), ls: 3 }); }

// ---------- Szenen ----------
function sceneA(t) {
  bg([[0, '#2a0d6e'], [.55, '#141a6b'], [1, '#07103a']]); stars(t, 1, t * .3); aurora(t, .8);
  const k = p(t, 0, .72), e = eo5(k), cx = lerp(980, 540, e), cy = lerp(-200, 820, e), r = lerp(20, 330, e);
  const out = eio(p(t, T.b - .45, T.b));
  g.save(); g.translate(540, 820); g.scale(1 + out * 1.4, 1 + out * 1.4); g.translate(-540, -820); g.globalAlpha = 1 - out * .6;
  if (k < 1) for (let i = 5; i > 0; i--) { g.globalAlpha = .12 * i / 5; moon(lerp(980, 540, eo5(clamp(k - i * .04))), lerp(-200, 820, eo5(clamp(k - i * .04))), r, t * 9, { glow: false, flag: false }); }
  g.globalAlpha = 1 - out * .6;
  if (t > .72 && t < 1.3) { g.save(); g.globalCompositeOperation = 'lighter'; const q = p(t, .72, 1.3); g.strokeStyle = `rgba(200,210,255,${(1 - q) * .8})`; g.lineWidth = 14 * (1 - q); g.beginPath(); g.arc(540, 820, 330 + q * 420, 0, 7); g.stroke(); g.restore(); }
  moon(cx, cy, r, k < 1 ? (1 - e) * 14 : 0, { light: -2.4 + t * .05 });
  g.restore();
  slam(['IMMER', 'DIESELBE', 'SEITE'], 540, 300, 86, 'IDB', '#ffffff', { t, s: 1.05 }, .3, { ls: -2, alpha: 1 - out });
  const kw = p(t, ph(1), ph(1) + .4);
  if (kw > 0) text('WARUM?', 540, 1330, 190, 'IDB', '#ffcf3a', { alpha: clamp(kw * 3) * (1 - out), sc: lerp(2.2, 1, eback(kw)), glow: 'rgba(255,190,40,.6)', blur: 50, ls: -5, stroke: 10, strokeColor: '#1a0b45' });
}

function orbitPanel(cy, u, mode, k, title, ok) {
  const ex = 540, R = 250, ang = u * 1.15 - 1.2, mx = ex + Math.cos(ang) * R, my = cy + Math.sin(ang) * R * .55;
  g.save(); g.globalAlpha = eo(k);
  g.fillStyle = ok ? 'rgba(40,200,140,.10)' : 'rgba(255,70,90,.10)'; g.beginPath(); g.roundRect(70, cy - 320, 940, 610, 40); g.fill();
  g.strokeStyle = ok ? 'rgba(80,230,160,.6)' : 'rgba(255,90,110,.6)'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.setLineDash([10, 14]); g.lineWidth = 3; g.beginPath(); g.ellipse(ex, cy, R, R * .55, 0, 0, 7); g.stroke(); g.setLineDash([]);
  earth(ex, cy, 80);
  // Blickrichtung Mond -> Erde, und die Richtung, in die die Flagge zeigt
  const toEarth = Math.atan2(cy - my, ex - mx), face = mode === 'fix' ? Math.PI / 2 : toEarth;
  const sees = Math.cos(face - toEarth) > .7;
  beam(ex, cy, mx, my, 3, sees ? [90, 240, 160] : [255, 80, 100], .7);
  moon(mx, my, 72, -face + Math.PI / 2, { dir: 0, glow: false, flag: false });
  // Markierung "unsere Seite"
  g.save(); g.translate(mx, my); g.rotate(face); g.fillStyle = '#ffcf3a'; g.shadowColor = '#ffcf3a'; g.shadowBlur = 20; g.beginPath(); g.arc(62, 0, 13, 0, 7); g.fill(); g.restore();
  g.restore();
  text(title, 540, cy - 270, 50, 'IDB', '#ffffff', { alpha: eo(k), ls: 2 });
  text(ok ? '✓' : '✗', 950, cy - 270, 70, 'IDB', ok ? '#4fe0a0' : '#ff5a6e', { alpha: eo(p(k, .5, 1)), sc: lerp(2, 1, eback(p(k, .5, 1))) });
  if (mode === 'fix') text(sees ? 'Gelber Fleck sichtbar' : 'Wir sähen die andere Seite', 540, cy + 250, 34, 'IDS', sees ? '#9ff0c8' : '#ff9aa8', { alpha: eo(k) });
  else text('1 Drehung = 1 Umlauf', 540, cy + 250, 38, 'IDX', '#9ff0c8', { alpha: eo(p(k, .4, 1)) });
}
function sceneB(t) {
  const u = t - T.b;
  bg([[0, '#1b0b4d'], [.5, '#0c1f63'], [1, '#2a0b45']]); stars(t, .6); aurora(t + 2, .45);
  orbitPanel(500, u, 'fix', p(t, ph(2) - .1, ph(2) + .5), 'OHNE DREHUNG', false);
  orbitPanel(1130, u, 'lock', p(t, ph(4) - .1, ph(4) + .5), 'MIT DREHUNG', true);
  text('DER MOND DREHT SICH', 540, 110, 76, 'IDB', '#ffffff', { alpha: eo(p(t, ph(4), ph(4) + .4)), sc: lerp(1.5, 1, eback(p(t, ph(4), ph(4) + .45))), ls: -1 });
}

function sceneC(t) {
  const u = t - T.c;
  bg([[0, '#0c0a3a'], [.6, '#251062'], [1, '#062a5c']]); stars(t, .7);
  const kS = eio(p(u, .6, 2.6)), sy = 1 + kS * .28, sx = 1 - kS * .1;
  earth(540, 1980, 560);
  // Schwerkraft-Linien von der Erde zum Mond
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = -3; i <= 3; i++) {
    const x0 = 540 + i * 110, k = ((u * .9 + Math.abs(i) * .17) % 1);
    g.strokeStyle = `rgba(120,200,255,${.35 * (1 - k)})`; g.lineWidth = 6; g.setLineDash([24, 18]); g.lineDashOffset = -u * 120;
    g.beginPath(); g.moveTo(540 + i * 60, 1420); g.quadraticCurveTo(x0, 1100, 540 + i * 25, 920); g.stroke();
  }
  g.setLineDash([]); g.restore();
  moon(540, 700, 260, .2, { sx, sy, light: -2.6 });
  const ka = p(u, 1.0, 1.6);
  if (ka > 0) { arrow(540, 980, 540, 1080 + kS * 40, [120, 220, 255], 10, eo(ka)); arrow(540, 420, 540, 330 - kS * 30, [120, 220, 255], 8, eo(ka) * .7); }
  label('GEZEITEN-BEULE', 540, 170, '#ffffff', p(u, 1.3, 1.8), 78);
  label('(stark übertrieben)', 540, 255, 'rgba(255,255,255,.7)', p(u, 1.7, 2.1), 36);
}

function sceneD(t) {
  const u = t - T.d, dur = T.e - T.d;
  bg([[0, '#2a0b4d'], [.5, '#3a0f5e'], [1, '#0b1a5a']]); stars(t, .6, -t * .2);
  const lockAt = ph(8) + .1 - T.d;
  // Drehgeschwindigkeit fällt über "Millionen Jahre" bis zum Einrasten
  const slow = eio(p(u, .3, lockAt));
  const spin = lerp(14, .35, slow);
  const ang = (() => { let a = 0, s = 0; const n = 60; for (let i = 0; i < n; i++) { const uu = u * i / n; s = lerp(14, .35, eio(p(uu, .3, lockAt))); a += s * u / n; } return a; })();
  const mx = 540, my = 720, R = 270;
  if (spin > 2) { g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283 + ang; g.strokeStyle = `rgba(200,180,255,${.18 * Math.min(1, spin / 10)})`; g.lineWidth = 6; g.beginPath(); g.arc(mx, my, R + 30 + (i % 3) * 18, a, a + .5 * Math.min(1, spin / 8)); g.stroke(); } g.restore(); }
  moon(mx, my, R, ang, { light: -2.5, glowCol: [190, 140, 255] });
  // Zähler
  if (u < lockAt + .1) { text('MILLIONEN JAHRE', 540, 190, 76, 'IDB', '#ffffff', { alpha: eo(p(u, .3, .7)) * (1 - p(u, lockAt - .2, lockAt + .1)), ls: -1 }); text('IM ZEITRAFFER', 540, 275, 40, 'IDX', '#d6c6ff', { alpha: eo(p(u, .5, .9)) * (1 - p(u, lockAt - .2, lockAt + .1)), ls: 6 }); }
  // Zwei Balken: Drehung und Umlauf
  const k1 = p(u, ph(8) - T.d - .1, ph(8) - T.d + .5), bw = 780, bx = 150;
  const dDay = lerp(1.2, 27.3, slow);
  [[1200, 'DREHUNG', dDay], [1330, 'UMLAUF', 27.3]].forEach(([y, lab, v], i) => {
    const k = eo(p(u, .4 + i * .25, 1.0 + i * .25)); if (k <= 0) return;
    g.save(); g.globalAlpha = k;
    g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.roundRect(bx, y - 26, bw, 52, 26); g.fill();
    const w = bw * v / 27.3; const gr = g.createLinearGradient(bx, 0, bx + w, 0); gr.addColorStop(0, '#7a5cff'); gr.addColorStop(1, i ? '#3fd0ff' : '#ff5ac8');
    g.fillStyle = gr; g.beginPath(); g.roundRect(bx, y - 26, Math.max(52, w), 52, 26); g.fill();
    g.restore();
    text(lab, bx, y - 62, 34, 'IDX', 'rgba(255,255,255,.85)', { align: 'left', alpha: k, ls: 3 });
    text(v.toFixed(1).replace('.', ',') + ' Tage', bx + bw, y - 62, 34, 'IDX', '#ffffff', { align: 'right', alpha: k });
  });
  // Einrasten
  const kl = p(t, ph(8), ph(8) + .35);
  if (kl > 0) {
    g.save(); g.translate(540, 1035); const s = lerp(2.5, 1, eback(kl)); g.scale(s, s); g.globalAlpha = clamp(kl * 3);
    g.strokeStyle = '#ffcf3a'; g.lineWidth = 14; g.beginPath(); g.arc(0, -40 + (1 - eo(kl)) * -30, 38, Math.PI, 0); g.stroke();
    g.fillStyle = '#ffcf3a'; g.beginPath(); g.roundRect(-58, -40, 116, 86, 14); g.fill(); g.fillStyle = '#3a0f5e'; g.beginPath(); g.arc(0, 0, 12, 0, 7); g.fill(); g.fillRect(-5, 0, 10, 24);
    g.restore();
  }
  const kt = p(t, ph(9), ph(9) + .4);
  if (kt > 0) { text('27,3 TAGE', 540, 200, 150, 'IDB', '#ffcf3a', { sc: lerp(1.8, 1, eback(kt)), alpha: clamp(kt * 3), glow: 'rgba(255,200,60,.6)', blur: 50, ls: -4 }); label('GEBUNDENE ROTATION', 540, 320, '#ffffff', p(kt, .3, 1), 50); }
}

function sceneE(t) {
  const u = t - T.e;
  bg([[0, '#071a4a'], [.5, '#1a0b45'], [1, '#3a0b3a']]); stars(t, .8);
  // Sonne rechts
  g.save(); g.globalCompositeOperation = 'lighter'; glow(1180, 760, 700, [255, 200, 90], .8); glow(1180, 760, 260, [255, 240, 200], 1); g.restore();
  const ks = eo(p(u, 0, .6));
  // Mond zwischen Sonne und Erde (Neumond): die Rückseite ist voll beleuchtet
  const swing = eio(p(t, ph(12) - .3, ph(12) + 1.2));
  earth(150, 1180, 110);
  const view = lerp(0, 1, swing);
  moon(560, 760, 280, Math.PI + view * .0, { light: 0, flag: false, glowCol: [255, 220, 150] });
  beam(150, 1180, 380, 900, 3, [255, 90, 110], .6 * ks);
  text('wir', 150, 1350, 34, 'IDS', 'rgba(255,255,255,.75)', { alpha: ks });
  // "dunkle Seite" durchstreichen
  const kd = p(t, ph(10), ph(10) + .35), kx = p(t, ph(11), ph(11) + .3);
  if (kd > 0) {
    text('DUNKLE SEITE', 540, 220, 104, 'IDB', '#ffffff', { alpha: clamp(kd * 3) * (1 - .45 * eo(kx)), sc: lerp(1.6, 1, eback(kd)), ls: -2 });
    if (kx > 0) { g.save(); g.strokeStyle = '#ff4a5e'; g.lineWidth = 16; g.lineCap = 'round'; g.shadowColor = '#ff4a5e'; g.shadowBlur = 20; g.beginPath(); g.moveTo(170, 230); g.lineTo(lerp(170, 910, eo(kx)), lerp(230, 205, eo(kx))); g.stroke(); g.restore(); }
  }
  const kr = p(t, ph(12), ph(12) + .4);
  if (kr > 0) { text('RÜCKSEITE', 540, 360, 112, 'IDB', '#ffcf3a', { alpha: clamp(kr * 3), sc: lerp(1.6, 1, eback(kr)), glow: 'rgba(255,200,60,.6)', blur: 40, ls: -2 }); label('VOLL IN DER SONNE', 540, 470, '#ffe9b0', p(kr, .3, 1), 48); }
  const ksun = p(t, ph(12) + .6, ph(12) + 1.2);
  if (ksun > 0) { arrow(1000, 760, 860, 760, [255, 220, 120], 10, eo(ksun)); }
  // Schlusskarte
  const ke = p(t, T.end, T.end + .5);
  if (ke > 0) {
    g.fillStyle = `rgba(6,4,20,${eo(ke) * .95})`; g.fillRect(0, 0, W, H);
    g.save(); g.font = '138px IDB'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '-4px';
    const gr = g.createLinearGradient(120, 0, 960, 0); gr.addColorStop(0, '#ff5ac8'); gr.addColorStop(.5, '#ffcf3a'); gr.addColorStop(1, '#3fd0ff');
    g.fillStyle = gr; g.globalAlpha = eo(ke); g.translate(540, 840); const s = lerp(1.25, 1, eback(ke)); g.scale(s, s);
    g.fillText('GEBUNDENE', 0, -76); g.fillText('ROTATION', 0, 76); g.restore();
    text('Darum sehen wir immer dieselbe Seite.', 540, 1060, 46, 'IDS', '#ffffff', { alpha: eo(p(t, T.end + .35, T.end + .8)) });
  }
}

function scene(t) {
  if (t < T.b) sceneA(t); else if (t < T.c) sceneB(t); else if (t < T.d) sceneC(t); else if (t < T.e) sceneD(t); else sceneE(t);
}
</script>
</body></html>
